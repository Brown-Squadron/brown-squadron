function setCall(v){v=(v||'').trim().slice(0,16);try{localStorage.setItem('bs_comms_call',v);}catch(e){}return v;}
function askCall(after){
  openSheet('<h3>Ton indicatif</h3><div class="sub">Il signe tes messages dans Comms.</div><div class="field" style="margin:14px 0"><input id="call-inp" maxlength="16" value="'+esc(myCall())+'" placeholder="BS-02" onkeydown="if(event.key===\'Enter\')$(\'call-ok\').click()"></div>'+
    '<button class="btn primary block" id="call-ok">Valider</button>');
  setTimeout(function(){var i=$('call-inp');if(i)i.focus();},200);
  $('call-ok').onclick=function(){var v=setCall($('call-inp').value);if(!v)return;closeSheet();_msgSig='';if(after)after();};
}
function renderComms(){
  var chans=commsChannels();
  $('view-comms').innerHTML='<div class="page-head"><div><h1 class="h-page">Comms</h1><div class="sub">Tu signes en '+callChip('renderComms')+'</div></div>'+
    '<button class="btn sm" onclick="newChannel()">'+I.plus+'Conversation</button></div>'+
    '<div class="panel" style="padding:4px 12px">'+chans.map(function(c){var l=lastByChan[c.id];
      return '<div class="conv" onclick="go(\'chat\',\''+c.id+'\')"><div class="avatar">'+esc(initials(c.name))+'</div><div class="info"><b>'+esc(c.name)+'</b><span>'+(l?esc((l.callsign?l.callsign+' : ':'')+l.body):'Aucun message')+'</span></div>'+
        (l?'<span class="tiny">'+msgTime(l.created_at,true)+'</span>':'')+'</div>';}).join('')+'</div>';
  loadPreviews();subscribeComms();
}
function msgTime(s,short){try{var d=new Date(s);var t=todayISO();var ds=isoOf(d);
  if(ds===t)return pad2(d.getHours())+':'+pad2(d.getMinutes());
  return short?d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}).replace('.',''):pad2(d.getHours())+':'+pad2(d.getMinutes());}catch(e){return '';}}
var _prevBusy=false;
function loadPreviews(){
  if(!sb||_prevBusy)return;_prevBusy=true;
  window._prevAt=Date.now();
  withTimeout(sb.from('messages').select('channel,callsign,body,created_at').order('created_at',{ascending:false}).limit(120),15000).then(function(r){
    _prevBusy=false;if(!r||r.error)return;var seen={},changed=false;
    (r.data||[]).forEach(function(m){var ch=m.channel||'general';if(!seen[ch]){seen[ch]=1;var o=lastByChan[ch];if(!o||o.created_at!==m.created_at){lastByChan[ch]=m;changed=true;}}});
    if(changed&&curView==='comms')renderCommsListOnly();
  },function(){_prevBusy=false;});
}
function renderCommsListOnly(){var v=$('view-comms');if(!v)return;var y=window.scrollY;
  var chans=commsChannels();var p=v.querySelector('.panel');if(!p)return;
  p.innerHTML=chans.map(function(c){var l=lastByChan[c.id];
    return '<div class="conv" onclick="go(\'chat\',\''+c.id+'\')"><div class="avatar">'+esc(initials(c.name))+'</div><div class="info"><b>'+esc(c.name)+'</b><span>'+(l?esc((l.callsign?l.callsign+' : ':'')+l.body):'Aucun message')+'</span></div>'+
      (l?'<span class="tiny">'+msgTime(l.created_at,true)+'</span>':'')+'</div>';}).join('');window.scrollTo(0,y);}
function newChannel(){
  openSheet('<h3>Nouvelle conversation</h3><div class="sub">Mission, sujet, équipe…</div><div class="field" style="margin:14px 0"><input id="chan-inp" maxlength="40" placeholder="Nom de la conversation" onkeydown="if(event.key===\'Enter\')createChannel()"></div><button class="btn primary block" onclick="createChannel()">Créer</button>');
  setTimeout(function(){var i=$('chan-inp');if(i)i.focus();},200);
}
function createChannel(){var name=($('chan-inp').value||'').trim();if(!name)return;var id='c_'+Date.now().toString(36);
  cloudMutate('__commschans__',function(x){x.type='commschans';x.data=x.data||{};var l=(x.data.list||[]).filter(function(c){return c.id.indexOf('op_')!==0;});l.push({id:id,name:name});x.data.list=l;},'commschans');
  closeSheet();go('chat',id);}
function deleteChannel(){
  if(!canAdmin()||!commsCur||commsCur==='general')return;
  var c=commsChannels().filter(function(x){return x.id===commsCur;})[0];
  if(!confirm('Supprimer « '+(c?c.name:'')+' » et tous ses messages ?'))return;
  var id=commsCur;if(sb)sb.from('messages').delete().eq('channel',id).then(function(){},function(){});
  cloudMutate('__commschans__',function(x){x.type='commschans';x.data=x.data||{};x.data.list=(x.data.list||[]).filter(function(c){return c.id!==id&&c.id.indexOf('op_')!==0;});},'commschans');
  go('comms',null,{replace:true});
}
function renderChat(id){
  var c=commsChannels().filter(function(x){return x.id===id;})[0];
  if(!c){go('comms',null,{replace:true});return;}
  commsCur=id;_msgSig='';$('tb-title').textContent=c.name;if(msgCache[id])setTimeout(function(){drawMsgs(msgCache[id]);},0);
  $('view-chat').innerHTML='<div class="chat"><div class="row" style="padding:10px 14px;border-bottom:1px solid var(--hair);gap:8px"><span class="tiny">Tu signes</span>'+callChip('')+''+
    '<span style="flex:1"></span>'+(canAdmin()&&id!=='general'?'<button class="btn sm danger" onclick="deleteChannel()">'+I.trash+'Supprimer</button>':'')+'</div>'+
    '<div class="log" id="chat-log"><div class="tiny" style="text-align:center;padding:30px">Chargement…</div></div>'+
    '<div class="composer"><textarea id="chat-inp" rows="1" maxlength="500" placeholder="Message" oninput="this.style.height=\'auto\';this.style.height=Math.min(this.scrollHeight,140)+\'px\'" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey&&window.innerWidth>760){event.preventDefault();sendMsg();}"></textarea>'+
    '<button class="send" onclick="sendMsg()" aria-label="Envoyer">'+I.send+'</button></div></div>';
  loadMsgs();subscribeComms();
}
/* messages : chargement complet à l'ouverture (200 derniers), puis seulement les NOUVEAUX */
var msgCache={};   /* canal -> liste de messages */
function chanQuery(q,chan){return chan==='general'?q.or('channel.eq.general,channel.is.null'):q.eq('channel',chan);}
function loadMsgs(full){
  if(!sb||!commsCur){var l=$('chat-log');if(l)l.innerHTML='<div class="empty"><b>Hors ligne</b>La messagerie a besoin du réseau.</div>';return;}
  var chan=commsCur;var cur=msgCache[chan];
  if(full||!cur){
    withTimeout(chanQuery(sb.from('messages').select('id,callsign,body,channel,created_at').order('created_at',{ascending:false}).limit(200),chan),15000).then(function(r){
      if(!r||r.error)return;msgCache[chan]=(r.data||[]).reverse();if(chan===commsCur)drawMsgs(msgCache[chan]);},function(){});
    return;
  }
  var last=cur.length?cur[cur.length-1].created_at:'1970-01-01T00:00:00Z';
  withTimeout(chanQuery(sb.from('messages').select('id,callsign,body,channel,created_at').gt('created_at',last).order('created_at',{ascending:true}).limit(100),chan),15000).then(function(r){
    if(!r||r.error||!r.data||!r.data.length)return;var seen={};cur.forEach(function(m){seen[m.id]=1;});
    r.data.forEach(function(m){if(!seen[m.id])cur.push(m);});if(chan===commsCur)drawMsgs(cur);},function(){});
}
function drawMsgs(rows){
  var box=$('chat-log');if(!box)return;var me=(myCall()||'').toUpperCase();var admin=canAdmin();
  var sig=rows.map(function(m){return m.id+'|'+m.body;}).join('~')+me+admin;if(sig===_msgSig)return;_msgSig=sig;
  if(rows.length){var lm=rows[rows.length-1];lastByChan[commsCur]=lm;}
  if(!rows.length){box.innerHTML='<div class="empty"><b>Conversation vide</b>Envoie le premier message.</div>';return;}
  var atBottom=(box.scrollHeight-box.scrollTop-box.clientHeight)<80;var html='',lastDay='',lastWho='';
  rows.forEach(function(m){var d=new Date(m.created_at);var ds=isoOf(d);
    if(ds!==lastDay){html+='<div class="day-sep">'+(ds===todayISO()?'Aujourd\'hui':fmtDay(ds,{weekday:'long',day:'numeric',month:'long'}))+'</div>';lastDay=ds;lastWho='';}
    var mine=me&&(m.callsign||'').toUpperCase()===me;var cont=lastWho===(m.callsign||'');lastWho=m.callsign||'';
    html+='<div class="msg'+(mine?' me':'')+(cont?' cont':'')+'" onclick="this.classList.toggle(\'sel\')">'+(admin&&m.id?'<button class="del" onclick="event.stopPropagation();delMsg(\''+m.id+'\')">×</button>':'')+
      (cont?'':'<div class="w">'+esc(m.callsign||'?')+'</div>')+'<div class="b">'+esc(m.body||'')+'</div><div class="t">'+pad2(d.getHours())+':'+pad2(d.getMinutes())+'</div></div>';});
  box.innerHTML=html;if(atBottom||!box._init){box.scrollTop=box.scrollHeight;box._init=1;}
}
function sendMsg(){
  var inp=$('chat-inp');var body=(inp.value||'').trim();if(!body)return;
  var call=myCall();if(!call){askCall(sendMsg);return;}
  if(!sb){toast('Pas de réseau : message non envoyé.',true);return;}
  inp.value='';inp.style.height='auto';
  var chan=commsCur;
  sb.from('messages').insert({callsign:call,body:body,channel:chan,created_at:new Date().toISOString()}).then(function(r){
    if(r&&r.error){toast('Message non envoyé : '+r.error.message,true);inp.value=body;return;}loadMsgs(false);},function(){toast('Message non envoyé.',true);inp.value=body;});
}
function delMsg(id){if(!canAdmin()||!confirm('Supprimer ce message ?'))return;sb.from('messages').delete().eq('id',id).then(function(){_msgSig='';loadMsgs(true);});}
function subscribeComms(){
  if(!sb)return;
  if(!commsRt){try{commsRt=sb.channel('comms-live-v3').on('postgres_changes',{event:'*',schema:'public',table:'messages'},function(pl){
    var ev=pl&&pl.eventType;
    if(curView==='chat'){if(ev==='DELETE'){_msgSig='';loadMsgs(true);}else loadMsgs(false);}
    clearTimeout(window._prevT);window._prevT=setTimeout(function(){if(curView==='comms')loadPreviews();},800);}).subscribe();}catch(e){}}
  /* filet de sécurité si le temps réel est coupé : nouveaux messages toutes les 20 s, aperçus toutes les 60 s */
  if(!commsPoll)commsPoll=setInterval(function(){if(document.hidden)return;if(curView==='chat')loadMsgs(false);else if(curView==='comms'&&Date.now()-(window._prevAt||0)>60000)loadPreviews();},20000);
}

/* =====================================================================
   ÉVAL BULL — simplifiée : une phase à la fois
   ===================================================================== */
var EVAL_PREFIX='__eval__';
var EVAL_P1=[{k:'appel',et:'Appel initial',cr:'Compréhension du cadre et des attentes.'},{k:'travail',et:'Travail perso (2 sem.)',cr:'Qualité des recherches (DEVGRU / ST6).'},
  {k:'debrief',et:'Débriefing',cr:'Capacité à corriger les erreurs, rigueur.'},{k:'candidature',et:'Candidature',cr:'Qualité de la lettre et pertinence des 3 spés.'}];
var EVAL_P2=[{k:'formation',et:'Formation spé',cr:'Maîtrise des outils spécifiques à la spé.'},{k:'drills',et:'Drills de base',cr:'Fluidité et répétition sans erreur.'},{k:'integration',et:'Intégration',cr:'Comportement au sein du groupe.'}];
var EVAL_P3=[{k:'equip',et:'Équipement spé',cr:'Liste de spécialisation complétée.'},{k:'aor2',et:'Progression AOR2',cr:'Tenue conforme + drills avancés (8 mois).'},{k:'aor1',et:'Progression AOR1',cr:'Tenue conforme + capacité OP (8 mois).'}];
var PHASES=[{k:'p1',l:'Prospect',obj:'Curiosité, recherche et motivation initiale.',rows:EVAL_P1},{k:'p2',l:'Recrue',obj:'Technique et cohésion — délai : 6 mois.',rows:EVAL_P2},
  {k:'p3',l:'Confirmé',obj:'Résilience et investissement matériel.',rows:EVAL_P3},{k:'f',l:'Bull',obj:'Admission finale : décision du collège des membres.'}];
var evalPhase=0;
function evalsList(){return Object.keys(db).filter(function(k){return k.indexOf(EVAL_PREFIX)===0&&db[k];}).map(function(k){var o=db[k];o._id=k;return o;}).sort(function(a,b){return (b.created||0)-(a.created||0);});}
function blankEval(){var e={type:'eval',created:Date.now(),candidat:'',referent:'',date_entree:'',p1:{},p1_perf:'',p1_spe:'',p1_green:false,p2:{},p2_etat:'',p2_conf:false,p3:{},
  f_temps:'',f_esprit:'',f_phys:'',f_unan:'',f_comment:'',f_dec:'',f_motifs:'',f_sign:'',f_cloture:''};
  EVAL_P1.forEach(function(r){e.p1[r.k]={ok:false,date:''};});EVAL_P2.forEach(function(r){e.p2[r.k]={ok:false,date:''};});EVAL_P3.forEach(function(r){e.p3[r.k]={ok:false,date:''};});return e;}
function phaseDone(e,i){
  function all(rows,ph){return rows.every(function(r){return e[ph]&&e[ph][r.k]&&e[ph][r.k].ok;});}
  if(i===0)return all(EVAL_P1,'p1')&&!!e.p1_green;if(i===1)return all(EVAL_P2,'p2')&&!!e.p2_conf;if(i===2)return all(EVAL_P3,'p3');return e.f_dec==='ADMIS';}
function evalStage(e){for(var i=0;i<4;i++){if(!phaseDone(e,i))return i;}return 4;}
function renderEvalList(){
  if(!canAdmin()){go('home',null,{replace:true});return;}
  var list=evalsList();
  $('view-eval').innerHTML='<div class="page-head"><div><h1 class="h-page">Éval Bull</h1><div class="sub">Suivi des candidats, de Prospect à Bull</div></div></div>'+
    (list.length?list.map(function(e){var s=evalStage(e);var dec=e.f_dec==='AJOURNE'?'Ajourné':(s>=4?'Admis Bull':'En phase '+PHASES[s].l);
      return '<div class="cand" onclick="go(\'eval-fiche\',\''+e._id+'\')"><div class="top"><div class="avatar">'+esc(initials(e.candidat))+'</div><b>'+esc(e.candidat||'Sans nom')+'</b><span class="tag">'+dec+'</span></div>'+
        '<div class="steps">'+PHASES.map(function(p,i){return '<div class="'+(i<s?'done':(i===s?'cur':''))+'"></div>';}).join('')+'</div>'+
        '<div class="steps-l">'+PHASES.map(function(p){return '<span>'+p.l+'</span>';}).join('')+'</div></div>';}).join('')
      :'<div class="empty"><b>Aucun candidat</b>Ouvre une fiche pour suivre un candidat en sélection.<br><button class="btn primary" onclick="newEval()">'+I.plus+'Nouvelle fiche</button></div>')+
    '<button class="fab" onclick="newEval()">'+I.plus+'Candidat</button>';
}
function newEval(){if(!canAdmin())return;var id=EVAL_PREFIX+uid();db[id]=blankEval();window._newDraftId=id;evalPhase=0;go('eval-fiche',id);}
function renderEvalFiche(id){
  if(!canAdmin()||!db[id]){go('eval',null,{replace:true});return;}
  if(currentEvalId!==id){evalPhase=Math.min(evalStage(db[id]),3);}
  currentEvalId=id;window._evalDraft=clone(db[id]);delete window._evalDraft._id;drawEval();
}
function ed(path,v){var e=window._evalDraft;var p=path.split('.');var o=e;for(var i=0;i<p.length-1;i++){o[p[i]]=o[p[i]]||{};o=o[p[i]];}o[p[p.length-1]]=v;window._formDirty=true;}
function eInput(label,path,type){var v=path.split('.').reduce(function(o,k){return o?o[k]:'';},window._evalDraft)||'';
  return '<div class="field"><label>'+label+'</label>'+(type==='textarea'?'<textarea oninput="ed(\''+path+'\',this.value)">'+esc(v)+'</textarea>':'<input type="'+(type||'text')+'" value="'+esc(v)+'" oninput="ed(\''+path+'\',this.value)">')+'</div>';}
function eChoice(label,key,opts){var v=window._evalDraft[key]||'';
  return '<div class="field"><label>'+label+'</label><div class="choice">'+opts.map(function(o){return '<button class="'+(v===o[0]?'on'+(o[2]?' bad':''):'')+'" onclick="ed(\''+key+'\',\''+(v===o[0]?'':o[0])+'\');drawEval()">'+o[1]+'</button>';}).join('')+'</div></div>';}
function eToggle(label,key){var v=!!window._evalDraft[key];
  return '<div class="crit"><div class="info"><b>'+label+'</b></div><label class="toggle"><input type="checkbox"'+(v?' checked':'')+' onchange="ed(\''+key+'\',this.checked);drawEval()"><span></span></label></div>';}
function drawEval(){
  var e=window._evalDraft;var ph=PHASES[evalPhase];var isNew=window._newDraftId===currentEvalId;
  var body='';
  if(ph.rows){
    body='<div class="panel"><div class="tiny" style="margin-bottom:4px">Objectif : '+ph.obj+'</div>'+ph.rows.map(function(r){var st=(e[ph.k]&&e[ph.k][r.k])||{};
      return '<div class="crit"><div class="info"><b>'+r.et+'</b><span>'+r.cr+'</span>'+(st.ok?'<br><input type="date" value="'+esc(st.date||'')+'" onchange="ed(\''+ph.k+'.'+r.k+'.date\',this.value)">':'')+'</div>'+
        '<label class="toggle"><input type="checkbox"'+(st.ok?' checked':'')+' onchange="evalTick(\''+ph.k+'\',\''+r.k+'\',this.checked)"><span></span></label></div>';}).join('')+'</div>';
    if(ph.k==='p1')body+='<div class="panel"><h2 class="h-sec">Sélection intermédiaire</h2><div class="grid1">'+eChoice('Marche 10 km — performance','p1_perf',[['A','A · Excellent'],['B','B · Satisfaisant'],['C','C · Insuffisant',1]])+eInput('Spécialité attribuée','p1_spe')+'</div>'+eToggle('Accès groupe Green validé','p1_green')+'</div>';
    if(ph.k==='p2')body+='<div class="panel"><h2 class="h-sec">Sélection confirmation</h2><div class="grid1">'+eInput('Marche 15 km — état physique à l\'arrivée','p2_etat')+'</div>'+eToggle('Passage au statut Confirmé validé','p2_conf')+'</div>';
  }else{
    body='<div class="panel"><h2 class="h-sec">Validation physique — 20 km</h2><div class="grid2 stack">'+eInput('Temps','f_temps')+eInput('État d\'esprit','f_esprit')+'</div><div style="margin-top:12px">'+eChoice('Résultat','f_phys',[['OK','OK'],['KO','KO',1]])+'</div></div>'+
      '<div class="panel"><h2 class="h-sec">Validation sociale</h2><div class="grid1">'+eChoice('Unanimité du vote','f_unan',[['Oui','Oui'],['Non','Non',1]])+eInput('Commentaire','f_comment')+'</div></div>'+
      '<div class="panel"><h2 class="h-sec">Décision</h2><div class="grid1">'+eChoice('Conclusion de l\'évaluateur','f_dec',[['ADMIS','Admis · remise du patch'],['AJOURNE','Ajourné',1]])+
        (e.f_dec==='AJOURNE'?eInput('Motifs','f_motifs','textarea'):'')+'<div class="grid2 stack">'+eInput('Signature de l\'évaluateur','f_sign')+eInput('Date de clôture','f_cloture','date')+'</div></div></div>';
  }
  var s=evalStage(e);
  $('view-eval-fiche').innerHTML=
    '<div class="panel"><div class="grid1">'+eInput('Candidat','candidat')+'<div class="grid2 stack">'+eInput('Référent évaluateur','referent')+eInput('Entrée en sélection','date_entree','date')+'</div></div></div>'+
    '<div class="tabs"><div class="seg">'+PHASES.map(function(p,i){return '<button class="'+(evalPhase===i?'on':'')+'" onclick="evalPhase='+i+';drawEval()">'+(i<s?'✓ ':'')+p.l+'</button>';}).join('')+'</div></div>'+
    body+
    '<div class="save-bar"><button class="btn primary" onclick="saveEval()">Enregistrer</button><button class="btn" onclick="genEvalPdf()">'+I.print+'PDF</button>'+(isNew?'':'<button class="btn danger" style="flex:0 0 auto" onclick="delEval()">'+I.trash+'</button>')+'</div>';
}
function evalTick(ph,k,on){var e=window._evalDraft;e[ph]=e[ph]||{};e[ph][k]=e[ph][k]||{ok:false,date:''};e[ph][k].ok=on;if(on&&!e[ph][k].date)e[ph][k].date=todayISO();window._formDirty=true;drawEval();}
function saveEval(){var e=window._evalDraft;e.type='eval';db[currentEvalId]=clone(e);window._formDirty=false;window._newDraftId=null;
  cloudSave(currentEvalId).then(function(ok){toast(ok?'Fiche enregistrée':'Enregistrée sur cet appareil, envoi dès que possible',!ok);});}
function delEval(){if(!confirm('Supprimer cette fiche d\'évaluation ?'))return;window._formDirty=false;cloudDelete(currentEvalId);go('eval',null,{replace:true});}

/* =====================================================================
   PDF / IMPRESSION
   ===================================================================== */
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
var _pdfjsP=null;
function ensurePdfJs(){if(window.pdfjsLib)return Promise.resolve();
  if(!_pdfjsP)_pdfjsP=loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js').then(function(){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';});
  return _pdfjsP;}
function showPdfWait(on){var el=$('pdf-wait');if(!el){el=document.createElement('div');el.id='pdf-wait';el.innerHTML='<div class="pw-box"><div class="pw-spin"></div><div class="pw-txt">Préparation du PDF…</div><div class="pw-sub">Intégration des documents joints</div></div>';document.body.appendChild(el);}el.style.display=on?'flex':'none';}
function renderPdfToImages(dataUrl){
  return ensurePdfJs().then(function(){
    var b64=dataUrl.split(',')[1];var bin=atob(b64);var arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){var imgs=[];var n=Math.min(pdf.numPages,400);var seq=Promise.resolve();
      for(var p=1;p<=n;p++){(function(no){seq=seq.then(function(){return pdf.getPage(no);}).then(function(page){var vp=page.getViewport({scale:1.6});
        var cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;return page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){imgs.push(cv.toDataURL('image/jpeg',0.8));});});})(p);}
      return seq.then(function(){return imgs;});});
  });
}
function docsToPagesAsync(docs){
  if(!docs||!docs.length)return Promise.resolve('');
  return Promise.all(docs.map(function(d,i){var name=esc(d.name||('Document '+(i+1)));var t=d.type||'';

   COMPTES ET ACCÈS (master)
   Appelle la fonction Supabase « comptes » (réservée aux comptes Master).
   ===================================================================== */
var accCache=null,accLegacy=true,_accLoading=null;
var ROLE_LABEL={admin:'Master',membre:'Membre',lecture:'Lecture'};
var ACC_ERR={reserve_master:'Réservé au master.',indicatif_deja_pris:'Cet indicatif a déjà un compte.',indicatif_vide:'Indicatif vide.',
  pas_soi_meme:'Impossible sur ton propre compte.',aucun_master_individuel:'Crée d\'abord ton propre compte master avant de couper les mots de passe partagés.',
  compte_introuvable:'Compte introuvable.',role_invalide:'Droits invalides.'};
async function accApi(action,payload,retried){
  if(!ensureSb()||!sb.functions)throw new Error('Pas de connexion internet.');
  var body=Object.assign({action:action},payload||{});
  var r;try{r=await withTimeout(sb.functions.invoke('comptes',{body:body}),20000);}catch(e){throw new Error('Pas de réponse du serveur. Vérifie que la fonction « comptes » est déployée.');}
  var data=r&&r.data,err=r&&r.error;
  var status=err&&err.context&&err.context.status;
  if(err&&!data){try{data=await err.context.json();}catch(e){data=null;}}
  if(data&&data.ok)return data;
  var code=data&&typeof data.error==='string'?data.error:'';
  if(!code){
    if(status===404)code='Supabase ne trouve pas la fonction « comptes ». Vérifie qu\'elle est déployée et nommée exactement comptes (en minuscules).';
    else if(status===401||status===403)code='Supabase bloque l\'appel : désactive « Verify JWT » dans les réglages de la fonction « comptes », puis Save.';
    else if(status>=500)code='La fonction « comptes » a planté (erreur '+status+'). Ouvre-la dans Supabase > Edge Functions > Logs et envoie une capture.';
    else if(err&&/Failed to send|fetch/i.test(err.message||''))code='Impossible de joindre la fonction « comptes » : elle n\'est pas déployée, ou il n\'y a pas de réseau.';
    else code=((data&&(data.message||data.msg))||(err&&err.message)||'Erreur inconnue')+(status?' (code '+status+')':'');
  }
  throw new Error(ACC_ERR[code]||code);
}

<script>
function parseAnyCoord(str){
  if(!str)return null;
  var s=str.trim().replace(/,/g,' ').replace(/\s+/g,' ');
  // 1) format décimal simple : deux nombres
  var dec=s.match(/^(-?\d+(?:\.\d+)?)[ ]+(-?\d+(?:\.\d+)?)$/);
  if(dec){var la=parseFloat(dec[1]),lo=parseFloat(dec[2]);
    if(Math.abs(la)<=90&&Math.abs(lo)<=180)return{lat:la,lon:lo};}
  // 2) format avec hémisphères et/ou DMS : on découpe en deux moitiés (lat puis lon)
  // on cherche les lettres N/S puis E/O/W
  function dmsToDec(part){
    if(!part)return null;
    var neg=/[swo]/i.test(part);
    var nums=part.match(/-?\d+(?:\.\d+)?/g);
    if(!nums||!nums.length)return null;
    var deg=parseFloat(nums[0]);
    var min=nums[1]?parseFloat(nums[1]):0;
    var sec=nums[2]?parseFloat(nums[2]):0;
    var val=Math.abs(deg)+min/60+sec/3600;
    if(neg||deg<0)val=-val;
    return val;
  }
  // séparer sur la frontière entre lat et lon : présence de N/S puis E/W/O
  var mm=s.match(/^(.*?[nsNS])\s*(.*[ewoEWO].*)$/);
  if(mm){var la2=dmsToDec(mm[1]),lo2=dmsToDec(mm[2]);
    if(la2!=null&&lo2!=null&&Math.abs(la2)<=90&&Math.abs(lo2)<=180)return{lat:la2,lon:lo2};}
  // 3) deux groupes DMS sans lettres, séparés : "43 54 12 / 4 49 37"
  var groups=s.split(/[\/|]/);
  if(groups.length===2){var la3=dmsToDec(groups[0]),lo3=dmsToDec(groups[1]);
    if(la3!=null&&lo3!=null&&Math.abs(la3)<=90&&Math.abs(lo3)<=180)return{lat:la3,lon:lo3};}
  return null;
}

function world(){

  return {pings:d.pings||[],shapes:d.shapes||[],stickers:d.stickers||[]};
}
function normWorld(x){
  if(x.data&&typeof x.data==='object'&&(x.data.pings||x.data.shapes||x.data.stickers)){Object.assign(x,x.data);delete x.data;}
  x.pings=x.pings||[];x.shapes=x.shapes||[];x.stickers=x.stickers||[];x.type='mapdata';return x;
}
function worldEdit(fn,undoOp){

/* ---------- géométrie ---------- */
function haversine(a,b){var R=6371000,r=Math.PI/180,dLa=(b[1]-a[1])*r,dLo=(b[0]-a[0])*r;
  var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLo/2)*Math.sin(dLo/2);return 2*R*Math.asin(Math.sqrt(s));}
function lineLen(c){var t=0;for(var i=1;i<c.length;i++)t+=haversine(c[i-1],c[i]);return t;}
function fmtDist(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(2).replace('.',',')+' km';}
function areaM2(c){if(c.length<3)return 0;var R=6378137,r=Math.PI/180,s=0;
  for(var i=0;i<c.length;i++){var p1=c[i],p2=c[(i+1)%c.length];s+=(p2[0]-p1[0])*r*(2+Math.sin(p1[1]*r)+Math.sin(p2[1]*r));}return Math.abs(s*R*R/2);}
function fmtArea(a){return a<10000?Math.round(a)+' m²':(a/10000).toFixed(2).replace('.',',')+' ha';}
function shortAge(ts){var m=Math.max(0,Math.round((Date.now()-ts)/60000));return m<60?m+' min':Math.floor(m/60)+' h';}
function ago(ts){if(!ts)return '';var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'à l\'instant';if(m<60)return 'il y a '+m+' min';var h=Math.round(m/60);return h<24?'il y a '+h+' h':'le '+new Date(ts).toLocaleDateString('fr-FR');}

var baseSwap=0,busyT=null;
function mapBusy(){if(busyT)return;busyT=setTimeout(function(){var e=$('mp-load');if(e)e.classList.add('on');},350);}
function mapIdle(){clearTimeout(busyT);busyT=null;var e=$('mp-load');if(e)e.classList.remove('on');}
function setBasemap(mode){
  if(!BASEMAPS[mode]||mode===mapBase&&map)return;mapBase=mode;lsSet('bs_map_base2',mode);
  if(!map||!mapReady)return;
  var want=BASEMAPS[mode].layers,token=++baseSwap;
  try{
    /* le nouveau fond passe au-dessus de l'ancien, qui reste visible tant que le nouveau charge : pas d'écran vide */
    want.forEach(function(id){map.moveLayer(id,'mw-zone');map.setLayoutProperty(id,'visibility','visible');});
  }catch(e){}
  function hideOld(){if(token!==baseSwap)return;BASE_LAYER_IDS.forEach(function(id){if(want.indexOf(id)<0){try{map.setLayoutProperty(id,'visibility','none');}catch(e){}}});}
  map.once('idle',hideOld);setTimeout(hideOld,6000);
}

function simplifyPath(pts,tolM){

    for(var i=i0+1;i<i1;i++){var d=segD(P[i],P[i0],P[i1]);if(d>md){md=d;mi=i;}}
    if(md>tolM&&mi>0){keep[mi]=true;stack.push([i0,mi],[mi,i1]);}}

/* ---------- boussole : direction où pointe le téléphone ----------

    setTimeout(function(){if(headOn&&gpsHeading==null)toast('Boussole indisponible sur ce téléphone.',true);},4000);}
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')
      DeviceOrientationEvent.requestPermission().then(function(s){if(s==='granted'||!isIOS())bind();else toast('Boussole refusée : autorise « Mouvement et orientation » dans Réglages > Safari.',true);})

function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}

function tiltCompensated(alpha,beta,gamma){

/* envoi de la direction à l'équipe : quand elle change de plus de 8° (max 1 fois / 1,5 s), et au moins toutes les 8 s */
function pushHeading(){

function loadPositions(){

    if(!r||r.error)return;var me=myCallsign();var next={};
    (r.data||[]).forEach(function(p){if(typeof p.lat!=='number'||typeof p.lon!=='number')return;if(p.pseudo===me&&gpsOn)return;var prev=gpsData[p.pseudo];if(prev&&prev._hAt&&Date.now()-prev._hAt<10000){p.heading=prev.heading;p._hAt=prev._hAt;}if(gpsFresh(p))next[p.pseudo]=p;});

/* temps réel pour TOUS ceux qui regardent la carte (pas seulement ceux qui partagent) :
   - positions : la ligne reçue est appliquée directement, sans relire toute la table ;
   - direction : diffusée en « broadcast » (direct entre appareils, sans écriture en base),
     donc la rotation du cône arrive en quelques dixièmes de seconde. */

  if(!sb)return;
  if(!gpsChan){try{gpsChan=sb.channel('positions-v4').on('postgres_changes',{event:'*',schema:'public',table:'positions'},function(pl){
      var row=pl&&pl.new&&pl.new.pseudo?pl.new:null;var me=myCallsign();
      if(pl&&pl.eventType==='DELETE'){var od=pl.old&&pl.old.pseudo;if(od&&od!==me){delete gpsData[od];renderGps();}else{clearTimeout(window._posT);window._posT=setTimeout(loadPositions,300);}return;}

      var prev=gpsData[row.pseudo];if(prev&&prev._hAt&&Date.now()-prev._hAt<10000&&typeof prev.heading==='number')row.heading=prev.heading,row._hAt=prev._hAt;

    }).subscribe();}catch(e){}}
  if(!headCh){try{headCh=sb.channel('bs-heading',{config:{broadcast:{self:false}}}).on('broadcast',{event:'h'},function(msg){
      var d=msg&&msg.payload;if(!d||!d.p||typeof d.h!=='number')return;applyRemoteHeading(d.p,d.h);}).subscribe();}catch(e){}}

/* les membres proches à l'écran sont REGROUPÉS (pastille ×N) au lieu de s'empiler */
function renderGps(){

        '<path d="M0 0 L-17 -36 A40 40 0 0 1 17 -36 Z" fill="url(#cg'+esc(p.pseudo).replace(/[^A-Za-z0-9]/g,'')+')"/></svg>'+

/* ---------- blackout (op de nuit) ---------- */
/* ---------- mode poche : l'écran reste allumé (noir) pour que le GPS continue ----------
   Un site web ne peut PAS lire le GPS quand le téléphone est verrouillé (règle iOS/Android).
   Le mode poche empêche la mise en veille : Wake Lock + vidéo muette en boucle en secours,

function keepAwake(on){
  if(on){
    try{if('wakeLock' in navigator&&!gpsWake)navigator.wakeLock.request('screen').then(function(w){gpsWake=w;w.addEventListener('release',function(){gpsWake=null;});}).catch(function(){});}catch(e){}
    if(!_nsVid){_nsVid=document.createElement('video');_nsVid.setAttribute('playsinline','');_nsVid.setAttribute('muted','');_nsVid.muted=true;_nsVid.loop=true;
      _nsVid.style.cssText='position:fixed;width:1px;height:1px;opacity:.01;left:0;top:0;pointer-events:none;';_nsVid.src=NOSLEEP_MP4;document.body.appendChild(_nsVid);}
    try{var pr=_nsVid.play();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}
  }else{
    try{if(_nsVid)_nsVid.pause();}catch(e){}
    if(!gpsOn){try{if(gpsWake){gpsWake.release();gpsWake=null;}}catch(e){}}
  }
}
function enterPocket(){
  if(!gpsOn){toast('Active d\'abord le partage de position.',true);toggleGps();return;}
  var v=$('blackout-veil');if(!v)return;pocketOn=true;keepAwake(true);stopHeading();GPS_MS=10000;_boTaps=0;
  v.innerHTML='<div class="pk"><b>Mode poche</b><span>Position envoyée toutes les 10 s</span><span>Ne verrouille pas le téléphone : range-le écran allumé.</span><span>Touche 5 fois pour sortir</span></div>';
  v.style.display='block';
  v.onclick=function(){_boTaps++;clearTimeout(_boT);_boT=setTimeout(function(){_boTaps=0;},3000);if(_boTaps>=5)exitPocket();};
}
function exitPocket(){var v=$('blackout-veil');if(v){v.style.display='none';v.onclick=null;}pocketOn=false;GPS_MS=3000;keepAwake(false);}
function enterBlackout(){enterPocket();}
function exitBlackout(){exitPocket();}
/* retour au premier plan : on relance le GPS (le navigateur a pu le couper) et on prévient si la position a été interrompue */
var _hiddenAt=0;
document.addEventListener('visibilitychange',function(){
  if(!gpsOn)return;
  if(document.hidden){_hiddenAt=Date.now();return;}
  var gone=_hiddenAt?Date.now()-_hiddenAt:0;_hiddenAt=0;
  keepAwake(pocketOn);
  try{if('wakeLock' in navigator&&!gpsWake)navigator.wakeLock.request('screen').then(function(w){gpsWake=w;}).catch(function(){});}catch(e){}
  try{if(gpsWatch!=null)navigator.geolocation.clearWatch(gpsWatch);}catch(e){}
  gpsWatch=navigator.geolocation.watchPosition(onGpsPos,function(){},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  gpsSentAt=0;
  if(gone>45000)toast('Écran verrouillé '+Math.round(gone/60000)+' min : position non transmise pendant ce temps.',true);
});

/* ---------- export PDF ---------- */
function genMapPDF(){
  if(!map||!mapReady){toast('Ouvre la carte d\'abord.',true);return;}
  var w=window.open('','_blank');
  function shoot(){
    var src=map.getCanvas();var cv=document.createElement('canvas');cv.width=src.width;cv.height=src.height;var g=cv.getContext('2d');
    try{g.drawImage(src,0,0);}catch(e){}
    var k=src.width/src.clientWidth;var wd=world();
    function at(lon,lat){var p=map.project([lon,lat]);return [p.x*k,p.y*k];}
    function disc(x,y,r,fill,stroke){g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=fill;g.fill();g.lineWidth=2*k;g.strokeStyle=stroke||'#fff';g.stroke();}
    wd.pings.forEach(function(p){var a=at(p.lon,p.lat);disc(a[0],a[1]-6*k,7*k,p.color||'#ffd24a');});
    wd.stickers.forEach(function(s){var a=at(s.lon,s.lat),x=a[0],y=a[1],r=11*k;
      if(s.kind==='medic'){disc(x,y,r,'#fff','#d93a26');g.fillStyle='#d93a26';g.fillRect(x-2.5*k,y-7*k,5*k,14*k);g.fillRect(x-7*k,y-2.5*k,14*k,5*k);}
      else if(s.kind==='danger'){g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r,y+r*.8);g.lineTo(x-r,y+r*.8);g.closePath();g.fillStyle='#ffb020';g.fill();g.fillStyle='#1a1405';g.font='bold '+(13*k)+'px Arial';g.textAlign='center';g.fillText('!',x,y+r*.6);}
      else if(s.kind==='ammo'){disc(x,y,r,'#2b2a1d','#d7b46a');g.fillStyle='#d7b46a';g.font='bold '+(10*k)+'px Arial';g.textAlign='center';g.fillText('MUN',x,y+3.5*k);}
      else disc(x,y,r*.8,'#5a6b3b');});
    var img='';try{img=cv.toDataURL('image/jpeg',.88);}catch(e){}
    var t=TYPES;var foots=wd.shapes.filter(function(s){return s.kind!=='zone';});var tac=wd.stickers.filter(function(s){return SYM[s.kind];});
    printDoc(w,'Carte tactique','Brown Squadron · '+new Date().toLocaleString('fr-FR'),'#5a6b3b',
      (img?'<img src="'+img+'" style="width:100%;border-radius:6px;border:1px solid #ccc">':'<p>Capture indisponible sur ce navigateur.</p>')+
      (foots.length?'<h2>Chemins et tracés</h2><table>'+foots.map(function(s,i){return '<tr><td style="width:20px;background:'+s.color+'"></td><td>'+({foot:'Chemin',measure:'Tracé'}[s.kind]||'Tracé')+' '+(i+1)+'</td><td>'+fmtDist(lineLen(s.coords||[]))+'</td></tr>';}).join('')+'</table>':'')+
      (tac.length?'<h2>Repères tactiques</h2><table>'+tac.map(function(s){return '<tr><td>'+SYM[s.kind].l+'</td><td>'+esc(s.note||'')+'</td><td>'+esc(s.by||'')+'</td><td>'+(s.ts?new Date(s.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'')+'</td></tr>';}).join('')+'</table>':''));
  }
  function go2(){map.once('render',shoot);map.triggerRepaint();}
  if(map.loaded()&&map.areTilesLoaded())go2();else{var done=false;var f=function(){if(done)return;done=true;go2();};map.once('idle',f);setTimeout(f,5000);}
}

/* ---------- ouverture depuis une opération ---------- */
function goMap(){go('map',null,{keepOpMode:true});}
function openMapForOp(){
  var id=currentOpId;var o=db[id];if(!o)return;mapOpMode=id;
  go('map',null,{keepOpMode:true});
  ensureMapLib().then(function(){initMap();var n=0;(function wait(){if(map&&mapReady)after();else if(n++<75)setTimeout(wait,200);})();});
  function after(){
    o=db[id]||o;fillMapOpSelect();var sel=$('map-op-select');if(sel)sel.value=id;
    if(o.gps&&typeof o.gps.lat==='number')map.flyTo({center:[o.gps.lon,o.gps.lat],zoom:15});
    else{var c=map.getCenter();cloudMutate(id,function(x){x.gps={lat:c.lat,lon:c.lng};x.type='operation';},'operation').then(redrawMap);
      toast('Point de l\'opération placé au centre de la carte. Modifie les coordonnées GPS dans la fiche pour l\'ajuster.');}
  }
}
