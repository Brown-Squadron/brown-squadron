<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brown Squadron</title>
<meta name="theme-color" content="#0d100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brown Squadron">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://data.geopf.fr" crossorigin>
<link rel="dns-prefetch" href="https://s3.amazonaws.com">
<link rel="dns-prefetch" href="https://server.arcgisonline.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   BROWN SQUADRON — OPS  ·  v3 (refonte mobile-first)
   Palette : nuit olive (AOR2 dans l'ombre), os, coyote, phosphore (vision nocturne)
   Typo : Archivo (axe largeur) — étendu pour l'identité, normal pour la lecture
   ===================================================================== */
:root{
  --night:#0d100c; --ground:#131711; --panel:#191e16; --raised:#21271d; --raised2:#2a3125;
  --hair:rgba(232,224,204,.08); --hair2:rgba(232,224,204,.15); --hair3:rgba(232,224,204,.26);
  --bone:#ebe3cf; --bone2:#b8b2a1; --bone3:#7f7b6f;
  --tan:#b49a6b; --tan2:#d4bc8c; --tan-ink:#1d1708;
  --phos:#a8efc0; --phos-dim:rgba(168,239,192,.14);
  --signal:#e2563f;
  --t-operation:#e2563f; --t-drill:#6ea7d6; --t-dominicale:#4fb3a0; --t-reunion:#a58fc9;
  --r-xs:6px; --r-s:10px; --r:14px; --r-l:18px; --r-xl:22px; --r-pill:999px;
  --glass:rgba(25,30,22,.92); --glass-night:rgba(13,16,12,.92); --scrim:rgba(0,0,0,.55);
  --shadow-1:0 2px 6px rgba(0,0,0,.45); --shadow-2:0 12px 30px rgba(0,0,0,.45);
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.2s;
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --top-h:58px; --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  /* alias consommés par le module carte (code historique) */
  --mono:var(--f); --txt:var(--bone); --muted:var(--bone2); --dim:var(--bone3); --amber:var(--tan2);
  --bg2:var(--ground); --line:var(--hair); --line2:var(--hair2); --surface:var(--panel); --surface2:var(--raised); --surface3:var(--raised2);
  --op:var(--signal); --aor1:var(--tan); --aor1b:var(--tan2); --aor2:#5a6b3b; --aor2b:#859a55; --accent:var(--tan);
  --r-lg:var(--r-l);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--night);color:var(--bone);}
body{font-family:var(--f);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
img{max-width:100%;}
a{color:var(--tan2);}
:focus-visible{outline:2px solid var(--phos);outline-offset:2px;}
.hidden{display:none!important;}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;}}

/* ---------- type ---------- */
.xp{font-stretch:125%;font-weight:800;letter-spacing:-.01em;line-height:1.05;}
.h-page{font-stretch:125%;font-weight:800;font-size:26px;letter-spacing:-.015em;line-height:1.05;margin:0;}
.h-sec{font-stretch:112%;font-weight:700;font-size:15px;letter-spacing:0;color:var(--bone);margin:0 0 10px;}
.sub{color:var(--bone2);font-size:14px;}
.tiny{color:var(--bone3);font-size:12px;}
.num{font-variant-numeric:tabular-nums;}

/* =====================================================================
   LOGIN
   ===================================================================== */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 30%,#1a2016 0%,var(--night) 62%);z-index:50;}
#login .scope{position:absolute;width:min(130vw,780px);aspect-ratio:1;left:50%;top:42%;transform:translate(-50%,-50%);opacity:.5;pointer-events:none;}
#login .card{position:relative;width:100%;max-width:340px;text-align:center;}
#login .badge{width:118px;height:138px;margin:0 auto 18px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));}
#login .badge img{width:100%;height:100%;object-fit:contain;}
#login h1{margin:0;font-stretch:125%;font-weight:800;font-size:28px;letter-spacing:-.01em;}
#login p.lead{margin:6px 0 26px;color:var(--bone2);font-size:14px;}
.pwd{position:relative;}
.pwd input{width:100%;height:54px;border-radius:var(--r);border:1px solid var(--hair3);background:rgba(13,16,12,.8);
  padding:0 52px 0 18px;font-size:18px;letter-spacing:.18em;text-align:center;}
.pwd input:focus{outline:none;border-color:var(--phos);box-shadow:0 0 0 4px var(--phos-dim);}
.pwd button{position:absolute;right:6px;top:6px;width:42px;height:42px;border:0;background:none;color:var(--bone3);border-radius:var(--r-s);}
#login .go{margin-top:12px;width:100%;}
#login-err{min-height:22px;margin:12px 0 0;color:var(--signal);font-size:14px;}

/* =====================================================================
   BOUTONS / CHAMPS
   ===================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:var(--r);
  border:1px solid var(--hair2);background:var(--raised);font-weight:600;font-size:15px;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s;}
.btn:active{transform:scale(.98);}
.btn:hover{border-color:var(--hair3);}
.btn.primary{background:var(--tan);border-color:var(--tan);color:var(--tan-ink);font-weight:700;}
.btn.primary:hover{background:var(--tan2);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--signal);border-color:rgba(226,86,63,.35);background:transparent;}
.btn.sm{height:36px;padding:0 13px;font-size:14px;border-radius:var(--r-s);}
.btn.block{width:100%;}
.btn svg{width:18px;height:18px;flex:none;}
.iconbtn{width:42px;height:42px;border-radius:var(--r);border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--bone2);}
.iconbtn:hover{background:var(--raised);color:var(--bone);}
.iconbtn svg{width:21px;height:21px;}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 18px + var(--safe-b));z-index:30;height:54px;padding:0 22px 0 18px;border-radius:var(--r-l);
  border:0;background:var(--tan);color:var(--tan-ink);font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.45);}
.fab svg{width:22px;height:22px;}
@media (min-width:960px){.fab{bottom:28px;right:32px;}}

.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field>label,.lbl{font-size:13px;color:var(--bone2);font-weight:500;}
.inp,.field input,.field select,.field textarea{width:100%;min-height:48px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--ground);
  padding:11px 14px;font-size:16px;color:var(--bone);}
.field textarea{min-height:110px;resize:vertical;line-height:1.5;}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--tan);box-shadow:0 0 0 3px rgba(180,154,107,.18);}
.field input:disabled,.field textarea:disabled,.field select:disabled{opacity:.6;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid1{display:grid;gap:12px;}
@media (max-width:520px){.grid2.stack{grid-template-columns:1fr;}}
.search{position:relative;}
.search input{width:100%;height:46px;border-radius:var(--r);border:1px solid var(--hair);background:var(--panel);padding:0 14px 0 42px;font-size:16px;}
.search input:focus{outline:none;border-color:var(--hair3);}
.search svg{position:absolute;left:14px;top:13px;width:19px;height:19px;color:var(--bone3);}

/* segmented control */
.seg{display:flex;background:var(--ground);border:1px solid var(--hair);border-radius:var(--r);padding:4px;gap:4px;}
.seg button{flex:1;min-height:40px;border:0;border-radius:var(--r-s);background:transparent;color:var(--bone2);font-weight:600;font-size:14px;padding:0 10px;}
.seg button.on{background:var(--raised2);color:var(--bone);box-shadow:0 1px 0 var(--hair3) inset;}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--hair2);background:transparent;color:var(--bone2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;}
.chip.on{background:var(--bone);color:var(--night);border-color:var(--bone);}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* =====================================================================
   COQUE APP
   ===================================================================== */
#app{min-height:100dvh;}
.topbar{position:sticky;top:0;z-index:40;height:calc(var(--top-h) + var(--safe-t));padding:var(--safe-t) 10px 0 16px;display:flex;align-items:center;gap:10px;
  background:rgba(13,16,12,.86);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--hair);}
.topbar .logo{width:30px;height:34px;flex:none;}
.topbar .logo img{width:100%;height:100%;object-fit:contain;}
.topbar .ttl{flex:1;min-width:0;font-stretch:125%;font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .back{margin-left:-8px;}
.sync{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:var(--r-pill);border:1px solid var(--hair);font-size:12px;color:var(--bone2);background:transparent;}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--bone3);}
.sync.ok i{background:var(--phos);box-shadow:0 0 8px var(--phos);}
.sync.busy i{background:var(--tan);animation:pulse 1s ease-in-out infinite;}
.sync.warn i{background:var(--signal);}
@keyframes pulse{50%{opacity:.25;}}
.role-pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);border:1px solid var(--hair2);color:var(--bone2);}
.role-pill.admin{color:var(--tan2);border-color:rgba(180,154,107,.45);}

main{padding:16px 16px calc(var(--nav-h) + 96px + var(--safe-b));max-width:1120px;margin:0 auto;}
.view{display:none;}
.view.on{display:block;animation:viewin .22s ease-out;}
@keyframes viewin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px;}
.page-head .sub{margin-top:4px;}

/* bottom nav (mobile) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;
  background:rgba(16,20,14,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--hair);}
.nav button{flex:1;border:0;background:none;color:var(--bone3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;position:relative;}
.nav button svg{width:23px;height:23px;}
.nav button.on{color:var(--bone);}
.nav button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--phos);box-shadow:0 0 10px var(--phos);}
/* rail (desktop) */
@media (min-width:960px){
  .nav{top:0;bottom:0;right:auto;width:92px;height:auto;flex-direction:column;justify-content:flex-start;padding:calc(var(--top-h) + 14px) 0 14px;border-top:0;border-right:1px solid var(--hair);gap:4px;}
  .nav button{flex:none;height:68px;}
  .nav button.on:before{top:16px;bottom:16px;left:0;right:auto;width:2px;height:auto;}
  .nav .more-only{display:none;}
  .nav .desk-only{display:flex!important;}
  #app{padding-left:92px;}
  .topbar{z-index:46;}
  main{padding:24px 32px 60px;}
}
.nav .desk-only{display:none;}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;z-index:80;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-bg.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:88dvh;overflow:auto;background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;
  border:1px solid var(--hair2);border-bottom:0;padding:10px 16px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);}
.sheet.on{transform:none;}
.sheet .grab{width:42px;height:5px;border-radius:var(--r-xs);background:var(--hair3);margin:2px auto 14px;}
.sheet h3{margin:0 0 4px;font-stretch:118%;font-weight:800;font-size:20px;}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;transform:translate(-50%,calc(100% + 60px));bottom:24px;border-radius:var(--r-xl);border-bottom:1px solid var(--hair2);}
  .sheet.on{transform:translate(-50%,0);}}
.menu-list{display:flex;flex-direction:column;gap:2px;margin-top:8px;}
.menu-item{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 12px;border-radius:var(--r);border:0;background:none;text-align:left;font-size:16px;font-weight:600;}
.menu-item:hover,.menu-item:active{background:var(--raised);}
.menu-item svg{width:22px;height:22px;color:var(--tan2);flex:none;}
.menu-item .r{margin-left:auto;color:var(--bone3);font-size:13px;font-weight:500;}

/* toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + var(--safe-b));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;}
.toast{background:var(--bone);color:var(--night);font-weight:600;font-size:14px;padding:12px 16px;border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.4);animation:tin .2s ease-out;}
.toast.err{background:var(--signal);color:#fff;}
@keyframes tin{from{opacity:0;transform:translateY(8px);}}

/* =====================================================================
   BLOCS GÉNÉRIQUES
   ===================================================================== */
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-l);padding:16px;}
.panel+.panel{margin-top:12px;}
.stack>*+*{margin-top:12px;}
.row{display:flex;align-items:center;gap:12px;}
.between{justify-content:space-between;}
.list{display:flex;flex-direction:column;}
.empty{text-align:center;padding:44px 20px;color:var(--bone2);}
.empty b{display:block;color:var(--bone);font-stretch:112%;font-size:18px;margin-bottom:6px;}
.empty .btn{margin-top:16px;}
.bar{height:6px;border-radius:var(--r-xs);background:var(--hair);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:var(--r-xs);background:var(--tan);transition:width .5s ease;}
.bar.phos i{background:var(--phos);}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);background:var(--raised);color:var(--bone2);}
.tag i{width:7px;height:7px;border-radius:50%;}
.divider{height:1px;background:var(--hair);margin:16px 0;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px;}
.kv dt{color:var(--bone3);}
.kv dd{margin:0;}
.avatar{width:44px;height:44px;border-radius:var(--r);flex:none;display:flex;align-items:center;justify-content:center;font-stretch:125%;font-weight:800;font-size:15px;
  background:var(--raised2);color:var(--tan2);border:1px solid var(--hair);}
.save-bar{position:sticky;bottom:calc(var(--nav-h) + 10px + var(--safe-b));z-index:20;margin-top:18px;display:flex;gap:10px;padding:10px;border-radius:var(--r-l);
  background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--hair2);}
.save-bar .btn{flex:1;}
@media (min-width:960px){.save-bar{bottom:16px;}}
.status-line{font-size:13px;color:var(--bone2);min-height:18px;margin-top:8px;text-align:center;}

/* =====================================================================
   ACCUEIL
   ===================================================================== */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--hair2);padding:22px 20px 20px;
  background:radial-gradient(130% 100% at 85% 0%,#1f2a1c 0%,#141a12 55%,#10140e 100%);cursor:pointer;}
.hero .reticle{position:absolute;right:-70px;top:-60px;width:300px;height:300px;opacity:.55;pointer-events:none;}
.hero .eyebrow{font-size:13px;color:var(--bone2);display:flex;align-items:center;gap:8px;}
.hero .live{width:8px;height:8px;border-radius:50%;background:var(--phos);box-shadow:0 0 10px var(--phos);}
.hero .t{font-stretch:125%;font-weight:800;font-size:clamp(28px,8vw,46px);line-height:1;letter-spacing:-.02em;margin:14px 0 8px;max-width:14ch;word-break:break-word;}
.hero .when{color:var(--bone2);font-size:15px;}
.hero .count{display:flex;align-items:baseline;gap:8px;margin-top:22px;}
.hero .count .n{font-stretch:125%;font-weight:800;font-size:64px;line-height:.9;color:var(--phos);text-shadow:0 0 24px rgba(168,239,192,.35);}
.hero .count .u{color:var(--bone2);font-size:14px;max-width:12ch;line-height:1.25;}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.stat{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-l);padding:14px;}
.stat .v{font-stretch:125%;font-weight:800;font-size:26px;line-height:1;}
.stat .v small{font-size:14px;color:var(--bone3);font-weight:700;margin-left:2px;}
.stat .l{font-size:13px;color:var(--bone2);margin-top:6px;}
.stat .bar{margin-top:10px;height:4px;}
.home-grid{display:grid;gap:12px;margin-top:12px;}
@media (min-width:960px){.home-grid{grid-template-columns:1.3fr 1fr;}.hero{padding:34px 34px 30px;}.hero .reticle{width:420px;height:420px;right:-60px;top:-90px;}}

/* ligne événement (accueil, calendrier, ops) */
.ev{display:flex;align-items:stretch;gap:14px;padding:12px 4px;border-bottom:1px solid var(--hair);cursor:pointer;}
.ev:last-child{border-bottom:0;}
.ev .d{width:52px;flex:none;text-align:center;border-radius:var(--r);background:var(--ground);border:1px solid var(--hair);padding:7px 0 6px;position:relative;overflow:hidden;}
.ev .d:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--tan));}
.ev .d b{display:block;font-stretch:125%;font-weight:800;font-size:22px;line-height:1;}
.ev .d span{font-size:11px;color:var(--bone2);font-weight:600;text-transform:lowercase;}
.ev .m{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.ev .m .n{font-weight:700;font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev .m .s{font-size:13px;color:var(--bone2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev .x{display:flex;align-items:center;color:var(--bone3);font-size:13px;gap:4px;}

/* =====================================================================
   MEMBRES
   ===================================================================== */
.mem{display:flex;align-items:center;gap:13px;padding:12px 12px;cursor:pointer;background:var(--panel);border:1px solid var(--hair2);border-radius:var(--r-l);margin-bottom:10px;transition:border-color .15s,background .15s;}
.mem:hover{border-color:var(--hair3);background:#1c2219;}
#view-membres .mem{position:relative;}
#view-membres .mem:before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--tan);opacity:.55;}
.sheet .mem{background:transparent;border:0;border-bottom:1px solid var(--hair);border-radius:0;margin:0;padding:12px 4px;}
.sheet .mem:before{display:none;}
.avatar.editable{cursor:pointer;position:relative;}
.avatar.editable:hover{border-color:var(--tan);}
.avatar.editable:after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--tan);border:2px solid var(--panel);}
.mem .info{flex:1;min-width:0;}
.mem .cs{font-stretch:118%;font-weight:800;font-size:16px;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mem .nm{font-size:13px;color:var(--bone2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mem .bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-top:8px;font-size:12px;color:var(--bone3);max-width:280px;}
.mem .bars .bar{height:4px;}
.mem .bars b{color:var(--bone2);font-weight:700;min-width:30px;text-align:right;}
.pam{display:flex;gap:5px;flex:none;}
.pam button{width:30px;height:30px;border-radius:var(--r-s);border:1px solid var(--hair2);background:var(--ground);font-size:12px;font-weight:800;color:var(--bone3);padding:0;}
.pam button.g{background:#2f6b3c;border-color:#4f9a5d;color:#e8ffe9;}
.pam button.y{background:#7a6418;border-color:#c09c2a;color:#fff6d6;}
.pam button.r{background:#7a2a20;border-color:#c24a37;color:#ffe3de;}
.mem-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
@media (min-width:960px){.mem-cols{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;}}

/* fiche */
.fiche-head{display:flex;align-items:center;gap:14px;margin:4px 0 16px;}
.fiche-head .avatar{width:58px;height:58px;font-size:20px;border-radius:var(--r-l);}
.fiche-head .cs{font-stretch:125%;font-weight:800;font-size:24px;line-height:1.05;text-transform:uppercase;word-break:break-word;}
.score{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:14px;}
.score .stat .v{color:var(--phos);}
.drill-admin{display:flex;align-items:center;gap:10px;margin-top:10px;}
.drill-admin input{width:96px;height:44px;border-radius:var(--r);border:1px solid var(--hair3);background:var(--ground);text-align:center;font-size:18px;font-weight:800;}
.drill-admin input:focus{outline:none;border-color:var(--phos);}
.tabs{position:sticky;top:calc(var(--top-h) + var(--safe-t));z-index:15;background:var(--night);padding:8px 0;margin:0 0 6px;}

/* kit */
.kit-legend{font-size:13px;color:var(--bone2);margin:10px 2px 6px;}
.kit-legend .star{color:var(--tan2);}
.kit{display:flex;flex-direction:column;}
.ki{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 2px;border-bottom:1px solid var(--hair);}
.ki.sub{padding-left:26px;min-height:46px;}
.ki.sub .kn{font-size:14px;color:var(--bone2);}
.ck{width:28px;height:28px;flex:none;border-radius:var(--r-s);border:1.5px solid var(--hair3);background:var(--ground);display:flex;align-items:center;justify-content:center;padding:0;}
.ck svg{width:16px;height:16px;opacity:0;color:var(--night);}
.ki.has>.ck,.ck.on{background:var(--phos);border-color:var(--phos);}
.ki.has>.ck svg,.ck.on svg{opacity:1;}
.kn{flex:1;min-width:0;font-size:15px;line-height:1.3;}
.kn .fold{display:block;font-size:12px;color:var(--bone3);background:none;border:0;padding:2px 0 0;}
.kq{width:58px;height:38px;flex:none;border-radius:var(--r-s);border:1px solid var(--hair2);background:var(--ground);text-align:center;font-size:15px;}
.kq:focus{outline:none;border-color:var(--tan);}
.star-btn{width:36px;height:36px;flex:none;border:0;background:none;border-radius:var(--r-s);color:var(--bone3);padding:0;display:flex;align-items:center;justify-content:center;}
.star-btn svg{width:21px;height:21px;}
.star-btn.on{color:var(--tan2);}
.star-btn.on svg{fill:currentColor;}
.kdel{width:32px;height:32px;flex:none;border:0;background:none;color:var(--bone3);border-radius:var(--r-s);padding:0;}
.kdel:hover{color:var(--signal);}
.kit-add{display:flex;gap:8px;margin-top:10px;}
.kit-add input{flex:1;height:44px;border-radius:var(--r);border:1px dashed var(--hair3);background:transparent;padding:0 12px;font-size:15px;}
.ki .grip{width:24px;flex:none;color:var(--bone3);cursor:grab;touch-action:none;text-align:center;}
.ki.dragging{opacity:.4;}
.ki.drop-above{box-shadow:0 -2px 0 var(--tan) inset;}

.photo{position:relative;border-radius:var(--r);border:1px dashed var(--hair3);background:var(--ground);aspect-ratio:16/10;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--bone3);font-size:14px;cursor:pointer;}
.photo img{width:100%;height:100%;object-fit:cover;}
.photo .x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:var(--r-s);border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;}

/* =====================================================================
   CALENDRIER
   ===================================================================== */
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:12px;}
.cal-head .mname{flex:1;font-stretch:125%;font-weight:800;font-size:24px;letter-spacing:-.015em;text-transform:capitalize;}
.cal-head .mname small{font-stretch:100%;font-weight:600;font-size:15px;color:var(--bone3);margin-left:6px;}
.cal{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-xl);padding:10px 8px 12px;touch-action:pan-y;user-select:none;}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--bone3);font-weight:600;padding:4px 0 8px;}
.cal .days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;}
.cal .day{position:relative;height:48px;border:0;background:none;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;font-size:16px;font-weight:600;color:var(--bone);}
.cal .day.out{color:var(--bone3);opacity:.45;}
.cal .day.today{color:var(--phos);}
.cal .day.today:after{content:"";position:absolute;top:31px;width:4px;height:4px;border-radius:50%;background:var(--phos);display:none;}
.cal .day.sel{background:var(--bone);color:var(--night);}
.cal .day .dots{display:flex;gap:3px;margin-top:5px;height:6px;}
.cal .day .dots i{width:6px;height:6px;border-radius:50%;}
.cal .day.range{background:rgba(232,224,204,.05);}
.cal .day.sel.range{background:var(--bone);}
.agenda-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 6px;}
.agenda-h b{font-stretch:112%;font-size:16px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--bone2);margin:12px 4px 0;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:8px;height:8px;border-radius:50%;}
@media (min-width:960px){.cal-layout{display:grid;grid-template-columns:minmax(420px,1fr) 1fr;gap:28px;align-items:start;}.cal .day{height:64px;}.agenda-h{margin-top:4px;}}

/* =====================================================================
   OPÉRATIONS
   ===================================================================== */
.op-card{display:block;position:relative;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--hair);background:var(--panel);padding:16px 16px 14px 18px;margin-bottom:10px;cursor:pointer;}
.op-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--tan));}
.op-card .top{display:flex;align-items:center;gap:10px;}
.op-card .date{font-size:13px;color:var(--bone2);font-weight:600;}
.op-card .n{font-stretch:118%;font-weight:800;font-size:20px;line-height:1.15;margin:8px 0 6px;word-break:break-word;}
.op-card .s{font-size:14px;color:var(--bone2);display:flex;flex-wrap:wrap;gap:4px 14px;}
.op-card .s span{display:inline-flex;align-items:center;gap:5px;}
.op-card .s svg{width:15px;height:15px;color:var(--bone3);}
.op-card.past{opacity:.62;}
.faces{display:flex;margin-left:auto;}
.faces span{width:26px;height:26px;border-radius:var(--r-s);background:var(--raised2);border:2px solid var(--panel);margin-left:-7px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--tan2);}
.faces span.more{color:var(--bone2);}
.grp-title{font-size:13px;font-weight:700;color:var(--bone3);margin:18px 4px 8px;}
@media (min-width:960px){.op-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}}

/* fiche op (lecture) */
.op-hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 20px;border:1px solid var(--hair2);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c,var(--tan)) 22%,#151a13) 0%,#141912 60%);}
.op-hero .t{font-stretch:125%;font-weight:800;font-size:clamp(26px,7.4vw,40px);line-height:1.02;letter-spacing:-.02em;margin:12px 0 10px;word-break:break-word;}
.op-hero .when{font-size:15px;color:var(--bone);}
.op-hero .where{font-size:14px;color:var(--bone2);margin-top:4px;}
.op-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.prose{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.6;color:var(--bone);}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
.doc{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;border:1px solid var(--hair2);background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;cursor:pointer;text-align:center;font-size:12px;color:var(--bone2);}
.doc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.doc svg{width:28px;height:28px;color:var(--tan2);}
.doc .x{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:var(--r-s);border:0;background:rgba(0,0,0,.65);color:#fff;z-index:2;}
.doc span{word-break:break-all;line-height:1.2;max-height:3.6em;overflow:hidden;}
.drop{border:1.5px dashed var(--hair3);border-radius:var(--r-l);padding:20px;text-align:center;color:var(--bone2);cursor:pointer;margin-bottom:12px;}
.drop.over{border-color:var(--phos);color:var(--phos);}
.pres{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--hair);cursor:pointer;}
.pres:last-child{border-bottom:0;}
.pres .avatar{width:38px;height:38px;border-radius:var(--r);font-size:13px;}
.pres .info{flex:1;min-width:0;}
.pres .info b{display:block;font-weight:700;text-transform:uppercase;font-stretch:112%;}
.pres .info span{font-size:13px;color:var(--bone2);}
.pres.on .avatar{background:var(--phos);color:var(--night);}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.typepick button{min-height:52px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--ground);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:600;}
.typepick button i{width:10px;height:10px;border-radius:50%;}
.typepick button.on{border-color:var(--bone);background:var(--raised2);}

/* =====================================================================
   DRILL
   ===================================================================== */
.course{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--r-l);border:1px solid var(--hair);background:var(--panel);margin-bottom:10px;cursor:pointer;}
.course .ic{width:46px;height:46px;border-radius:var(--r);flex:none;display:flex;align-items:center;justify-content:center;background:rgba(110,167,214,.12);color:var(--t-drill);}
.course .ic svg{width:22px;height:22px;}
.course .info{flex:1;min-width:0;}
.course .info b{display:block;font-weight:700;font-size:16px;line-height:1.25;}
.course .info span{font-size:13px;color:var(--bone2);}
.reader{max-width:720px;}
.reader .h{font-stretch:125%;font-weight:800;font-size:clamp(26px,7vw,38px);line-height:1.04;letter-spacing:-.02em;margin:10px 0 8px;}
.reader figure{margin:18px 0;}
.reader figure img{border-radius:var(--r-l);display:block;width:100%;}
.reader figcaption{font-size:13px;color:var(--bone2);margin-top:8px;}
.reader .video{position:relative;aspect-ratio:16/9;border-radius:var(--r-l);overflow:hidden;margin:18px 0;background:#000;}
.reader .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.reader .pdf{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);border:1px solid var(--hair2);margin:14px 0;cursor:pointer;}
.reader .pdf svg{width:26px;height:26px;color:var(--tan2);}
.blk{border:1px solid var(--hair2);border-radius:var(--r-l);padding:10px;margin-bottom:10px;background:var(--ground);}
.blk .bt{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;color:var(--bone2);font-weight:600;}
.blk .bt .sp{flex:1;}
.blk textarea{width:100%;min-height:120px;border:0;background:transparent;font-size:16px;line-height:1.55;resize:vertical;padding:4px;}
.blk textarea:focus{outline:none;}
.blk img{border-radius:var(--r);display:block;}
.blk input{width:100%;height:42px;margin-top:8px;border-radius:var(--r-s);border:1px solid var(--hair);background:var(--panel);padding:0 12px;font-size:15px;}
.addbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* =====================================================================
   COMMS
   ===================================================================== */
.conv{display:flex;align-items:center;gap:13px;padding:12px 6px;border-bottom:1px solid var(--hair);cursor:pointer;}
.conv .avatar{border-radius:50%;}
.conv .info{flex:1;min-width:0;}
.conv .info b{display:block;font-weight:700;font-size:16px;}
.conv .info span{display:block;font-size:14px;color:var(--bone2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat{display:flex;flex-direction:column;height:calc(100dvh - var(--top-h) - var(--safe-t) - var(--nav-h) - var(--safe-b));margin:-16px -16px 0;}
.chat .log{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:4px;}
.msg{max-width:82%;align-self:flex-start;background:var(--raised);border-radius:var(--r-l) var(--r-l) var(--r-l) var(--r-xs);padding:8px 12px 6px;position:relative;}
.msg .w{font-size:12px;font-weight:800;color:var(--tan2);margin-bottom:2px;text-transform:uppercase;font-stretch:112%;}
.msg .b{font-size:16px;white-space:pre-wrap;word-break:break-word;}
.msg .t{font-size:11px;color:var(--bone3);text-align:right;margin-top:2px;}
.msg.me{align-self:flex-end;background:#2c3a2a;border-radius:var(--r-l) var(--r-l) var(--r-xs) var(--r-l);}
.msg.me .w{display:none;}
.msg.cont{margin-top:-1px;}
.msg .del{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--hair2);background:var(--panel);color:var(--bone3);font-size:13px;display:none;padding:0;}
.msg:hover .del,.msg.sel .del{display:block;}
.day-sep{align-self:center;font-size:12px;color:var(--bone3);margin:12px 0 6px;padding:3px 10px;border-radius:var(--r-pill);background:var(--ground);}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--hair);background:var(--panel);}
.composer textarea{flex:1;min-height:46px;max-height:140px;border-radius:var(--r-xl);border:1px solid var(--hair2);background:var(--ground);padding:12px 16px;font-size:16px;resize:none;line-height:1.35;}
.composer textarea:focus{outline:none;border-color:var(--hair3);}
.composer .send{width:46px;height:46px;border-radius:50%;border:0;background:var(--tan);color:var(--tan-ink);flex:none;display:flex;align-items:center;justify-content:center;}
.composer .send svg{width:20px;height:20px;}
.callsign-chip{height:30px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--hair2);background:transparent;font-size:13px;font-weight:700;color:var(--tan2);}
@media (min-width:960px){.chat{margin:-24px -32px 0;height:calc(100dvh - var(--top-h));}}

/* =====================================================================
   ÉVAL BULL
   ===================================================================== */
.cand{padding:14px;border-radius:var(--r-l);border:1px solid var(--hair);background:var(--panel);margin-bottom:10px;cursor:pointer;}
.cand .top{display:flex;align-items:center;gap:12px;}
.cand .top b{flex:1;font-stretch:118%;font-weight:800;font-size:18px;}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px;}
.steps div{height:5px;border-radius:var(--r-xs);background:var(--hair2);}
.steps div.done{background:var(--phos);}
.steps div.cur{background:var(--tan);}
.steps-l{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px;font-size:12px;color:var(--bone3);}
.crit{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--hair);}
.crit:last-child{border-bottom:0;}
.crit .info{flex:1;min-width:0;}
.crit .info b{display:block;font-weight:700;font-size:15px;}
.crit .info span{font-size:13px;color:var(--bone2);}
.crit input[type=date]{width:auto;min-height:38px;height:38px;padding:0 8px;font-size:13px;border-radius:var(--r-s);border:1px solid var(--hair2);background:var(--ground);margin-top:8px;color:var(--bone2);}
.toggle{position:relative;width:52px;height:32px;flex:none;}
.toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2;}
.toggle span{position:absolute;inset:0;border-radius:var(--r-pill);background:var(--raised2);border:1px solid var(--hair2);transition:.2s;}
.toggle span:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--bone2);transition:.2s;}
.toggle input:checked+span{background:var(--phos);border-color:var(--phos);}
.toggle input:checked+span:after{transform:translateX(20px);background:var(--night);}
.choice{display:flex;gap:8px;flex-wrap:wrap;}
.choice button{flex:1;min-height:46px;min-width:90px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--ground);font-weight:700;}
.choice button.on{background:var(--bone);color:var(--night);border-color:var(--bone);}
.choice button.on.bad{background:var(--signal);border-color:var(--signal);color:#fff;}

#blackout-veil{position:fixed;inset:0;background:#000;z-index:2147483647;display:none;touch-action:none;}
#blackout-veil .bo-hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);color:#151515;font-size:10px;}
#blackout-veil .bo-gps{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#0a2a0a;}
#pdf-wait{display:none;position:fixed;inset:0;z-index:99998;background:rgba(7,9,6,.92);align-items:center;justify-content:center;}
#pdf-wait .pw-box{text-align:center;}
#pdf-wait .pw-spin{width:48px;height:48px;margin:0 auto 16px;border-radius:50%;border:3px solid var(--hair2);border-top-color:var(--phos);animation:spin 1s linear infinite;}
#pdf-wait .pw-txt{font-weight:800;color:var(--bone);}
#pdf-wait .pw-sub{font-size:13px;color:var(--bone2);margin-top:4px;}
@keyframes spin{to{transform:rotate(360deg);}}
#doc-pop{position:fixed;inset:0;z-index:9600;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:12px;}
#doc-pop.show{display:flex;}
#doc-pop img{max-width:100%;max-height:80dvh;border-radius:var(--r);}
#doc-pop iframe{width:min(900px,96vw);height:78dvh;border:0;border-radius:var(--r);background:#fff;}
/* droits par rôle */
body:not(.role-admin) .admin-only{display:none!important;}
body.role-lecture .edit-only{display:none!important;}
body[data-view=chat] main{padding-bottom:0;}
body[data-view=chat] #toasts{bottom:calc(var(--nav-h) + 90px + var(--safe-b));}
@media (min-width:960px){body[data-view=chat] main{padding-bottom:0;}}
a.btn{text-decoration:none;color:inherit;}
.sheet:not(.on){visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;}
.pdf-pages .pdf-page{display:block;width:100%;border-radius:var(--r-s);margin:0 0 10px;background:#fff;}
.score .chips{flex-wrap:wrap;}

/* =====================================================================
   CARTE v4
   ===================================================================== */
body[data-view=map] main{padding:0;max-width:none;}
.mp{position:relative;height:calc(100dvh - var(--top-h) - var(--safe-t) - var(--nav-h) - var(--safe-b));background:#0a0d08;overflow:hidden;}
@media (min-width:960px){.mp{height:calc(100dvh - var(--top-h) - var(--safe-t));}}
body.map-fs .topbar,body.map-fs .nav{display:none;}
body.map-fs #app{padding-left:0;}
body.map-fs .mp{position:fixed;inset:0;height:100dvh;z-index:60;}
#map-canvas{position:absolute;inset:0;}
.maplibregl-ctrl-top-right{top:calc(8px);right:4px;}
.maplibregl-ctrl-group{background:var(--glass)!important;border:1px solid var(--hair2);border-radius:var(--r)!important;box-shadow:none!important;}
.maplibregl-ctrl-group button{width:38px!important;height:38px!important;}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--hair)!important;}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(.92);}
.maplibregl-ctrl-attrib{background:rgba(13,16,12,.7)!important;color:var(--bone3);font-size:10px;}
.maplibregl-ctrl-attrib a{color:var(--bone2)!important;}
.mp-top{position:absolute;left:10px;top:10px;right:60px;z-index:5;display:flex;gap:8px;pointer-events:none;}
.mp-folder{pointer-events:auto;display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 12px;border-radius:var(--r);background:var(--glass);border:1px solid var(--hair2);max-width:100%;backdrop-filter:blur(8px);}
.mp-folder span{font-size:12px;color:var(--bone3);font-weight:600;}
.mp-folder select{border:0;background:transparent;font-weight:700;font-size:14px;max-width:52vw;padding:0 4px;color:var(--bone);}

.mp-side{position:absolute;right:4px;top:136px;z-index:5;display:flex;flex-direction:column;gap:8px;}
.mp-fab{width:40px;height:40px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--glass);color:var(--bone);display:flex;align-items:center;justify-content:center;padding:0;backdrop-filter:blur(8px);}
.mp-fab svg{width:21px;height:21px;}
.mp-fab.live{background:var(--signal);border-color:var(--signal);color:#fff;animation:gpspulse 1.6s infinite;}
@keyframes gpspulse{0%,100%{box-shadow:0 0 0 0 rgba(226,86,63,.55);}50%{box-shadow:0 0 0 8px rgba(226,86,63,0);}}
.mp-dock{position:absolute;left:8px;right:8px;bottom:calc(8px + (var(--safe-b) * 0));z-index:6;display:flex;flex-direction:column;gap:8px;pointer-events:none;}

.mp-dock>*{pointer-events:auto;}
.mp-hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-l);background:rgba(232,224,204,.96);color:var(--night);font-size:14px;font-weight:600;}
.mp-hint .t{flex:1;min-width:150px;}
.mp-hint .b{display:flex;gap:6px;margin-left:auto;}
.mp-hint .btn.ghost{border-color:rgba(13,16,12,.25);color:var(--night);}
.mp-hint .btn.primary{background:var(--night);border-color:var(--night);color:var(--bone);}
.mp-hint .btn:disabled{opacity:.35;}
.mp-tray{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px;border-radius:var(--r-l);background:var(--glass);border:1px solid var(--hair2);backdrop-filter:blur(10px);}
.mp-tray::-webkit-scrollbar{display:none;}
.mp-tool{flex:1 0 auto;min-width:62px;height:58px;border-radius:var(--r);border:0;background:transparent;color:var(--bone);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;padding:0 8px;}
.mp-tool svg{width:22px;height:22px;}
.mp-tool.on{background:var(--tan);color:var(--tan-ink);}
.mp-tool:disabled{opacity:.3;}
.mp-tool .mp-sym{width:28px;height:28px;display:block;}
.mp-tool .mp-sym svg{width:28px;height:28px;}
.mp-tool.tac.on{background:var(--bone);color:var(--night);}
.mp-dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:block;}
.mp-modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:var(--r);background:var(--glass);border:1px solid var(--hair2);}
.mp-modes button{height:38px;border:0;border-radius:var(--r-s);background:transparent;color:var(--bone2);font-weight:700;font-size:14px;}
.mp-modes button.on{background:var(--raised2);color:var(--bone);}
@media (min-width:960px){.mp-dock{left:50%;right:auto;transform:translateX(-50%);width:560px;bottom:16px;}}
.mp-colors{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;}
.mp-colors button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--hair3);}
.mp-colors button.on{border-color:var(--night);box-shadow:0 0 0 3px var(--bone);}
.mp-colors.sm{margin-top:4px;gap:8px;}
.mp-colors.sm button{width:32px;height:32px;}
.map-search{display:flex;gap:8px;}
.map-search input{flex:1;min-width:0;height:46px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--ground);padding:0 14px;font-size:16px;}
.map-search button{height:46px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--raised);padding:0 16px;font-weight:700;}
.mp-row{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--hair);}
.mp-row-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:11px 4px;border:0;background:none;text-align:left;font-size:15px;}
.mp-row-main i{width:12px;height:12px;border-radius:50%;flex:none;}
.mp-row-main span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mp-row-main small{color:var(--bone3);font-size:12px;flex:none;}
/* marqueurs : aucune propriété transform sur la racine */
.mk-ping{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.mk-ping i{display:block;width:18px;height:18px;border-radius:50% 50% 50% 0;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.6);rotate:-45deg;margin-bottom:4px;}
.mk-ping .n,.mk-sym .n,.mk-op span{margin-bottom:4px;background:var(--glass-night);color:var(--bone);font-size:12px;font-weight:700;padding:2px 8px;border-radius:var(--r-xs);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--hair2);}
.mk-sym{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.mk-sym .s{display:block;width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7));}
.mk-sym .s svg{width:34px;height:34px;display:block;}
.mk-sym .s.bs{border-radius:50%;background:var(--aor2);border:2px solid #fff;display:flex;align-items:center;justify-content:center;width:30px;height:30px;}
.mk-sym .s.bs img{width:72%;}
.mk-sym .n{margin:4px 0 0;}
.mk-sym.k-medic .s{animation:medpulse 1.8s ease-in-out infinite;border-radius:50%;}
@keyframes medpulse{0%,100%{box-shadow:0 0 0 0 rgba(226,86,63,.7);}50%{box-shadow:0 0 0 10px rgba(226,86,63,0);}}
.mk-op{display:flex;flex-direction:column-reverse;align-items:center;cursor:pointer;}
.mk-op i{display:block;width:26px;height:26px;border-radius:50%;border:3px solid var(--signal);box-shadow:0 0 0 2px rgba(0,0,0,.5),inset 0 0 0 4px rgba(226,86,63,.25);background:radial-gradient(circle,var(--signal) 0 3px,transparent 4px);}
.mk-op span{margin:0 0 4px;border-color:rgba(226,86,63,.6);}
.mk-lbl{background:var(--glass-night);border:1px solid var(--tan);color:var(--tan2);font-size:12px;font-weight:800;padding:2px 7px;border-radius:var(--r-xs);white-space:nowrap;cursor:pointer;}
.mk-gps{position:relative;width:26px;height:26px;cursor:default;}
.mk-gps .dot{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;border:3px solid #fff;}
.mk-gps .cone{position:absolute;left:-27px;top:-27px;width:80px;height:80px;pointer-events:none;transform-origin:50% 50%;transition:transform .12s linear;}
.mk-gps .dot{z-index:1;}
.mk-gps .n{z-index:2;}
.mk-gps .n{position:absolute;left:50%;top:30px;translate:-50% 0;background:var(--glass-night);color:#fff;font-size:12px;font-weight:800;padding:2px 7px;border-radius:var(--r-xs);white-space:nowrap;line-height:1.35;text-align:center;border:1px solid var(--hair2);}
.mk-gps.me .dot{border-color:var(--phos);}
.mk-gps.grp{cursor:pointer;width:32px;height:32px;}
.mk-gps.grp .dot{left:0;top:0;width:32px;height:32px;background:var(--bone);color:var(--night);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;border:3px solid #46b29d;}
.mk-gps.grp .n{top:36px;}
body[data-view=map] #toasts{top:calc(var(--top-h) + var(--safe-t) + 62px);bottom:auto;}
body.map-fs #toasts{top:calc(var(--safe-t) + 62px);}
body[data-view=map] .toast{font-size:13px;padding:9px 13px;}
.mp-tool{height:52px;}
.mp-hint{padding:8px 10px;font-size:14px;}
.mp.drawing .maplibregl-marker{pointer-events:none;}
.mp-tool{flex:1 1 0;min-width:46px;padding:0 2px;font-size:11px;}
@media (min-width:420px){.mp-tool{font-size:12px;}}
/* étiquettes de distance / surface */
.mk-dist{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 0;border-radius:var(--r-s);background:var(--glass-night);border:1px solid rgba(232,224,204,.22);color:#fff;cursor:pointer;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.45);overflow:hidden;}
.mk-dist i{align-self:stretch;width:5px;flex:none;}
.mk-dist svg{width:15px;height:15px;color:var(--bone2);flex:none;margin-left:3px;}
.mk-dist b{font-size:14px;font-weight:800;letter-spacing:.01em;}
.mk-dist small{font-size:11px;color:var(--bone3);font-weight:600;padding-left:6px;border-left:1px solid var(--hair2);}
.mk-dist.live{background:rgba(232,224,204,.97);color:var(--night);border-color:transparent;pointer-events:none;}
.mk-dist.live svg,.mk-dist.live small{color:#4a4a3e;}
.mk-dist.live small{border-left-color:rgba(0,0,0,.15);}
.mk-sym .s{position:relative;}
.mk-sym .s em{position:absolute;left:24px;top:-6px;font-style:normal;font-size:10px;font-weight:800;background:var(--glass-night);color:#fff;border-radius:var(--r-xs);padding:1px 5px;border:1px solid var(--hair2);white-space:nowrap;}
.mp-fromme{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--ground);border:1px solid var(--hair2);font-size:14px;}
.mp-fromme b{font-size:16px;}
.mp-coord{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;height:44px;padding:0 12px;border-radius:var(--r);border:1px dashed var(--hair3);background:transparent;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.mp-coord span{font-size:12px;color:var(--tan2);font-weight:700;}
#blackout-veil .pk{position:absolute;left:0;right:0;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:6px;color:#2a2a2a;font-size:12px;text-align:center;padding:0 30px;pointer-events:none;}
#blackout-veil .pk b{font-size:14px;color:#333;}
.mp-fab.bg{border-color:var(--phos);color:var(--phos);box-shadow:0 0 0 2px rgba(168,239,192,.25);}
.mp-status{margin-top:12px;padding:12px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--ground);display:flex;flex-direction:column;gap:4px;}
.mp-status b{font-size:15px;}
.mp-status span{font-size:13px;color:var(--bone2);}
.mp-status .btn{align-self:flex-start;margin-top:6px;}
.mp-status.ok{border-color:var(--phos);}
.mp-status.ok b{color:var(--phos);}
.mk-gps.stale .dot{background:#6b6b62!important;box-shadow:0 0 0 2px rgba(0,0,0,.45)!important;border-color:#aaa;}
.mk-gps.stale .cone{display:none;}
.mk-gps.stale .n{opacity:.75;border-style:dashed;}

/* connexion par indicatif */
.login-field input{width:100%;height:54px;border-radius:var(--r);border:1px solid var(--hair3);background:rgba(13,16,12,.8);padding:0 18px;font-size:18px;text-align:center;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;}
#login-newpwd .login-field input{text-transform:none;letter-spacing:.1em;}
.login-field input:focus{outline:none;border-color:var(--phos);box-shadow:0 0 0 4px var(--phos-dim);}
#login .pwd input{letter-spacing:.12em;}
.login-switch{margin-top:6px;border:0;background:none;color:var(--bone2);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px;}
.login-help{margin:4px 0 0;color:var(--bone3);font-size:13px;}
.cred{display:grid;gap:10px;margin:14px 0;}
.cred div{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r);background:var(--ground);border:1px solid var(--hair2);}
.cred span{font-size:13px;color:var(--bone3);}
.cred b{font-size:22px;font-stretch:112%;letter-spacing:.04em;user-select:all;}
/* présence */
.rsvp-me{margin:12px 0 4px;padding:12px;border-radius:var(--r-l);background:var(--ground);border:1px solid var(--hair2);}
.rsvp-me .lbl{margin-bottom:8px;}
.rsvp-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.rsvp-b{min-height:52px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--raised);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;color:var(--bone);}
.rsvp-b i{font-style:normal;font-size:16px;line-height:1;opacity:.7;}
.rsvp-b.k-yes.on{background:var(--phos);border-color:var(--phos);color:var(--night);}
.rsvp-b.k-no.on{background:var(--signal);border-color:var(--signal);color:#fff;}
.rsvp-b.k-maybe.on{background:var(--tan);border-color:var(--tan);color:var(--tan-ink);}
.rsvp-b.on i{opacity:1;}
.hero-rsvp{margin-top:16px;}
.hero-rsvp .rsvp-b{background:rgba(13,16,12,.55);}
.rsvp-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px;}
.rsvp-sum span{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:var(--r);background:var(--ground);font-size:11px;color:var(--bone2);text-align:center;line-height:1.2;}
.rsvp-sum b{font-size:20px;font-stretch:118%;margin-bottom:2px;}
.pres.ro{cursor:default;}
.rsvp-mini{font-size:12px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);margin-left:auto;}
.rsvp-mini.k-yes{background:rgba(168,239,192,.15);color:var(--phos);}
.rsvp-mini.k-no{background:rgba(226,86,63,.15);color:var(--signal);}
.rsvp-mini.k-maybe{background:rgba(180,154,107,.18);color:var(--tan2);}

/* =====================================================================
   CARTE — téléphone en paysage : carte plein écran, outils en colonne
   ===================================================================== */
.mp-back{display:none;}
@media (orientation:landscape) and (max-height:560px){
  body[data-view=map] .topbar,body[data-view=map] .nav{display:none;}

  #mp-full{display:none;}
  .mp-back{display:flex;position:absolute;z-index:6;top:8px;left:calc(8px + env(safe-area-inset-left));width:38px;height:38px;}
  .mp-back svg{width:20px;height:20px;}
  /* dossier */
  .mp-top{top:8px;left:calc(54px + env(safe-area-inset-left));right:auto;}
  .mp-folder{height:38px;padding:0 4px 0 10px;}
  .mp-folder span{display:none;}
  .mp-folder select{font-size:13px;max-width:34vw;}
  /* zoom / boussole carte en haut à droite, boutons GPS en bas à droite */

  .mp-modes{order:-1;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:var(--r);flex:none;}
  .mp-modes button{height:28px;font-size:0;border-radius:var(--r-s);padding:0;}
  .mp-modes button[data-tray=edit]:after{content:'Édition';font-size:11px;}
  .mp-modes button[data-tray=tac]:after{content:'Tactique';font-size:11px;}
  .mp-tray{display:grid;grid-template-columns:1fr 1fr;overflow-x:hidden;overflow-y:auto;padding:4px;gap:2px;border-radius:var(--r);min-height:0;flex:0 1 auto;}
  .mp-tool{width:100%;min-width:0;height:46px;font-size:10px;gap:2px;padding:0;}
  .mp-tool svg{width:20px;height:20px;}
  .mp-tool .mp-sym,.mp-tool .mp-sym svg{width:24px;height:24px;}
  .mp-dot{width:20px;height:20px;}
  .maplibregl-ctrl-bottom-right{right:calc(112px + env(safe-area-inset-right));}
  /* consigne de dessin : en bas, à droite de la colonne d'outils */
  .mp-hint{position:absolute;left:124px;bottom:0;width:min(520px,calc(100vw - 260px));}
  body[data-view=map] #toasts,body.map-fs #toasts{top:10px;bottom:auto;}
  /* fenêtres : panneau latéral à droite, la carte reste visible */
  .sheet{left:auto;right:0;top:0;bottom:0;width:min(420px,62vw);max-height:none;border-radius:var(--r-xl) 0 0 var(--r-xl);border:1px solid var(--hair2);border-right:0;
    padding:10px calc(16px + env(safe-area-inset-right)) 16px 16px;transform:translateX(105%);}
  .sheet.on{transform:none;}
  .sheet .grab{display:none;}

}

/* carte : fine barre de chargement des tuiles */
.mp-load{position:absolute;z-index:5;top:0;left:0;right:0;height:3px;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none;}
.mp-load.on{opacity:1;}
.mp-load:before{content:'';position:absolute;top:0;bottom:0;width:35%;background:var(--phos);border-radius:2px;animation:mpload 1.1s ease-in-out infinite;}

<div id="blackout-veil"><div class="bo-gps" id="blackout-gps"></div><div class="bo-hint">Tape 5 fois pour sortir</div></div>

<!-- ===================== CONNEXION ===================== -->
<div id="login">
  <svg class="scope" viewBox="0 0 400 400" aria-hidden="true">
    <defs><radialGradient id="lg1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a8efc0" stop-opacity=".10"/><stop offset=".7" stop-color="#a8efc0" stop-opacity=".02"/><stop offset="1" stop-color="#a8efc0" stop-opacity="0"/></radialGradient></defs>
    <circle cx="200" cy="200" r="196" fill="url(#lg1)"/>
    <g fill="none" stroke="#a8efc0" stroke-opacity=".18"><circle cx="200" cy="200" r="190"/><circle cx="200" cy="200" r="130" stroke-dasharray="2 6"/><circle cx="200" cy="200" r="70"/>
    <path d="M200 10v120M200 270v120M10 200h120M270 200h120"/></g>
  </svg>
  <div class="card">
    <div class="badge" id="login-badge"></div>
    <h1>Brown Squadron</h1>
    <div id="login-form">
      <p class="lead" id="login-lead">Connecte-toi avec ton indicatif</p>
      <div id="login-call-wrap" class="login-field"><input id="login-call" placeholder="Indicatif (ex. BS-07)" autocapitalize="characters" autocomplete="username" spellcheck="false" onkeydown="if(event.key==='Enter')$('login-pwd').focus()"></div>
      <div class="pwd">
        <input type="password" id="login-pwd" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryLogin()">
        <button type="button" onclick="togglePwd()" aria-label="Afficher le mot de passe"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button class="btn primary go" id="login-go" onclick="tryLogin()">Entrer</button>
      <p id="login-err"></p>
      <p class="login-help">Mot de passe oublié : demande au master de le réinitialiser.</p>
    </div>
    <div id="login-newpwd" class="hidden">
      <p class="lead">Bienvenue <b id="np-who"></b>. Choisis ton mot de passe personnel.</p>
      <div class="login-field"><input type="password" id="np-1" placeholder="Nouveau mot de passe (6 caractères min.)" autocomplete="new-password"></div>
      <div class="login-field"><input type="password" id="np-2" placeholder="Confirmer" autocomplete="new-password" onkeydown="if(event.key==='Enter')saveNewPwd()"></div>
      <button class="btn primary go" onclick="saveNewPwd()">Enregistrer et entrer</button>

</div>

<!-- ===================== APPLICATION ===================== -->

  <header class="topbar">

    <div class="ttl" id="tb-title">Brown Squadron</div>
    <button class="sync" id="sync-pill" onclick="openMenu()"><i></i><span id="sync-txt">…</span></button>

/* ---------- utilitaires ---------- */
function uid(){return 'x'+Date.now()+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function nl2br(s){return esc(s).replace(/\n/g,'<br>');}
function $(id){return document.getElementById(id);}
function pad2(n){return ('0'+n).slice(-2);}
function isoOf(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function todayISO(){return isoOf(new Date());}

function fmtDay(s,opt){try{var x=dOf(s).toLocaleDateString('fr-FR',opt||{weekday:'long',day:'numeric',month:'long'});return x.charAt(0).toUpperCase()+x.slice(1);}catch(e){return frDate(s);}}
function daysUntil(s){return Math.round((dOf(s)-dOf(todayISO()))/864e5);}
function initials(s){s=(s||'').replace(/[^A-Za-zÀ-ÿ0-9 \-]/g,'').trim();if(!s)return '?';
  var w=s.split(/[\s\-]+/).filter(Boolean);return (w.length>1?w[0][0]+w[1][0]:s.slice(0,2)).toUpperCase();}
function heureRange(o){if(!o||!o.heure)return '';return o.heure_fin?(o.heure+' → '+o.heure_fin):o.heure;}
function clone(o){return JSON.parse(JSON.stringify(o||{}));}

/* =====================================================================
   STOCKAGE LOCAL : IndexedDB (plusieurs centaines de Mo possibles)
   L'ancienne version mettait tout dans localStorage (≈5 Mo max) : sur
   mobile, dès que photos/PDF dépassaient la limite, l'écriture échouait
   en silence -> au redémarrage, l'appli avait perdu des fiches.
   ===================================================================== */
var IDB=null;
function idbOpen(){
  return new Promise(function(res){
    try{
      var r=indexedDB.open('brown_squadron_ops',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('rows');};
      r.onsuccess=function(){IDB=r.result;res(true);};
      r.onerror=function(){res(false);};
      r.onblocked=function(){res(false);};
    }catch(e){res(false);}
  });
}
function idbAll(){
  return new Promise(function(res){
    if(!IDB){res({});return;}
    try{
      var out={};var tx=IDB.transaction('rows','readonly');var st=tx.objectStore('rows');
      var req=st.openCursor();
      req.onsuccess=function(){var c=req.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};
      req.onerror=function(){res(out);};
    }catch(e){res({});}
  });
}
var _idbQueue={},_idbT=null;
function idbPut(id){_idbQueue[id]=1;clearTimeout(_idbT);_idbT=setTimeout(idbFlush,250);}
function idbFlush(){
  if(!IDB){_idbQueue={};return;}
  var ids=Object.keys(_idbQueue);_idbQueue={};
  try{
    var tx=IDB.transaction('rows','readwrite');var st=tx.objectStore('rows');
    ids.forEach(function(id){if(db[id])st.put({d:db[id],u:dbTs[id]||null},id);else st.delete(id);});
  }catch(e){}
}
/* appelé par le module carte après modification */
var MAP_WORLD_KEY_CORE='__mapworld__';
function cacheLocal(id){if(id){idbPut(id);return;}idbPut(MAP_WORLD_KEY_CORE);Object.keys(db).forEach(function(k){if(db[k]&&db[k].type==='operation')idbPut(k);});}

/* ---------- files d'attente (envois / suppressions non encore confirmés par le serveur) ---------- */
function lsGet(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pendingList(){return lsGet('bs_pending_push',[]);}
function pendingAdd(id){var p=pendingList();if(p.indexOf(id)<0){p.push(id);lsSet('bs_pending_push',p);}}
function pendingRemove(id){var p=pendingList();var i=p.indexOf(id);if(i>=0){p.splice(i,1);lsSet('bs_pending_push',p);}}
function delList(){return lsGet('bs_pending_del',[]);}
function delAdd(id){var p=delList();if(p.indexOf(id)<0){p.push(id);lsSet('bs_pending_del',p);}}
function delRemove(id){var p=delList();var i=p.indexOf(id);if(i>=0){p.splice(i,1);lsSet('bs_pending_del',p);}}

/* =====================================================================
   SYNCHRO SUPABASE — nouvelle méthode
   1) on envoie ce qui attend localement ;
   2) on lit l'INDEX léger du serveur (id, type, updated_at) ;
   3) on supprime localement ce qui n'existe plus sur le serveur ;
   4) on ne télécharge QUE les fiches nouvelles/modifiées, par petits lots,
      une fiche lourde qui échoue ne bloque plus les autres.
   Plus de curseur de date : l'heure de l'appareil n'a plus aucune influence.
   ===================================================================== */
var syncBusy=false,syncAgain=false,syncState='busy',syncText='Synchro…',lastSyncAt=null;
function withTimeout(q,ms){
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  if(ctrl&&q&&q.abortSignal)q=q.abortSignal(ctrl.signal);
  return new Promise(function(res,rej){
    var t=setTimeout(function(){try{ctrl&&ctrl.abort();}catch(e){}rej(new Error('délai dépassé'));},ms);
    Promise.resolve(q).then(function(r){clearTimeout(t);res(r);},function(e){clearTimeout(t);rej(e);});
  });
}
function setSync(state,text){
  syncState=state;syncText=text;
  var p=$('sync-pill');if(!p)return;
  var n=pendingList().length+delList().length;
  p.className='sync '+state;
  $('sync-txt').textContent=n?(n+' en attente'):text;
  if(n&&state==='ok')p.className='sync warn';
}
async function flushPending(){
  if(!sb)return;
  var dels=delList();
  for(var i=0;i<dels.length;i++){
    try{var r=await withTimeout(sb.from('entries').delete().eq('id',dels[i]),20000);if(!r.error)delRemove(dels[i]);}catch(e){}
  }
  var ids=pendingList();
  for(var j=0;j<ids.length;j++){
    if(!db[ids[j]]){pendingRemove(ids[j]);continue;}
    await cloudSave(ids[j],true);
  }
}
async function cloudRefresh(){
  if(!sb){setSync('warn','Hors ligne');return;}
  if(syncBusy){syncAgain=true;return;}
  syncBusy=true;setSync('busy','Synchro…');
  try{
    await flushPending();
    /* index léger */
    var idx=[],from=0;
    while(true){
      var r=await withTimeout(sb.from('entries').select('id,type,updated_at').order('id',{ascending:true}).range(from,from+999),25000);
      if(r.error)throw r.error;
      var rows=r.data||[];idx=idx.concat(rows);
      if(rows.length<1000)break;from+=1000;
    }
    var localCount=Object.keys(db).filter(function(k){return db[k]&&!isIgnored(k,db[k].type);}).length;
    if(!idx.length&&localCount>3){
      /* le serveur ne renvoie rien alors que l'appli a des données : accès refusé (sécurité), pas une base vide */
      setSync('warn','Accès refusé');syncBusy=false;
      if(!window._reauthAsked){window._reauthAsked=1;
        if(confirm('Le serveur refuse l\'accès aux données (sécurité activée).\nReconnecte-toi avec le mot de passe de l\'escouade.'))logout();}
      return;
    }
    var server={};idx.forEach(function(x){server[x.id]=x;});
    var pend={};pendingList().forEach(function(id){pend[id]=1;});
    var dels={};delList().forEach(function(id){dels[id]=1;});
    var changed=false;
    /* suppressions faites ailleurs + nettoyage des types abandonnés */
    Object.keys(db).forEach(function(id){
      var gone=!server[id]&&!pend[id];
      if(gone||isIgnored(id,db[id]&&db[id].type)||dels[id]){delete db[id];delete dbTs[id];idbPut(id);changed=true;}
    });
    /* fiches à télécharger */
    var need=idx.filter(function(x){return !isIgnored(x.id,x.type)&&!pend[x.id]&&!dels[x.id]&&dbTs[x.id]!==x.updated_at;})
      .map(function(x){return x.id;});
    /* priorité : opérations, membres, kit-list, cours (ce qu'on regarde en premier) */
    var prio={operation:0,membre:1,kitlist:2,commschans:2,pam:2,cours:3,eval:4,mapdata:5};
    need.sort(function(a,b){return (prio[(server[a]||{}).type]==null?9:prio[server[a].type])-(prio[(server[b]||{}).type]==null?9:prio[server[b].type]);});
    var failed=0,got=0;
    async function fetchIds(ids,ms){
      var res=await withTimeout(sb.from('entries').select('id,type,data,updated_at').in('id',ids),ms);
      if(res.error)throw res.error;
      (res.data||[]).forEach(function(row){
        var d=(row.data&&typeof row.data==='object')?row.data:{};
        d.type=row.type||d.type||'';
        db[row.id]=d;dbTs[row.id]=row.updated_at;idbPut(row.id);got++;
      });
    }
    for(var i=0;i<need.length;i+=6){
      var batch=need.slice(i,i+6);
      setSync('busy','Synchro '+Math.min(i+6,need.length)+'/'+need.length);
      try{await fetchIds(batch,30000);}
      catch(e){
        /* lot trop lourd ou réseau faible : une par une, sans bloquer le reste */
        for(var k=0;k<batch.length;k++){try{await fetchIds([batch[k]],60000);}catch(e2){failed++;}}
      }
      changed=true;renderSoon();
    }
    lastSyncAt=new Date();
    if(changed)renderSoon();
    if(failed){setSync('warn',failed+' fiche(s) non reçue(s)');clearTimeout(window._retryT);window._retryT=setTimeout(cloudRefresh,10000);}
    else setSync('ok','À jour');
    try{migrateKitModel();}catch(e){}
  }catch(err){
    setSync('warn','Hors ligne');
  }finally{
    syncBusy=false;
    if(syncAgain){syncAgain=false;setTimeout(cloudRefresh,300);}
  }
}
async function cloudSave(id,fromFlush){
  pendingAdd(id);idbPut(id);
  if(!sb){setSync('warn','Hors ligne');return false;}
  var d=db[id];if(!d){pendingRemove(id);return true;}
  try{
    var ts=new Date().toISOString();
    var r=await withTimeout(sb.from('entries').upsert({id:id,type:d.type||'',data:d,updated_at:ts}).select('updated_at'),60000);
    if(r.error)throw r.error;
    dbTs[id]=(r.data&&r.data[0]&&r.data[0].updated_at)||ts;
    pendingRemove(id);idbPut(id);
    if(!fromFlush)setSync('ok','À jour');
    return true;
  }catch(e){
    if(!fromFlush){setSync('warn','En attente');toast('Pas de réseau : enregistré sur cet appareil, envoi automatique dès que possible.',true);}
    return false;
  }
}
async function cloudDelete(id){
  delete db[id];delete dbTs[id];idbPut(id);pendingRemove(id);delAdd(id);renderSoon();
  if(!sb)return;
  try{var r=await withTimeout(sb.from('entries').delete().eq('id',id),20000);if(!r.error)delRemove(id);}catch(e){}
  setSync(syncState,syncText);
}
/* modification « fusionnée » : on relit la version serveur juste avant d'écrire,
   pour ne pas écraser ce qu'un autre membre vient d'enregistrer (présences, PAM, kit-list) */
async function cloudMutate(id,fn,defType){
  pendingAdd(id);
  var local=db[id]?db[id]:{type:defType||''};fn(local);db[id]=local;renderSoon(true);
  if(sb){
    try{
      var r=await withTimeout(sb.from('entries').select('data,type').eq('id',id).maybeSingle(),12000);
      if(!r.error&&r.data){var fresh=r.data.data||{};fresh.type=r.data.type||fresh.type||defType||'';fn(fresh);db[id]=fresh;}
    }catch(e){}
  }
  return cloudSave(id);
}
var _renderT=null;
function renderSoon(now){clearTimeout(_renderT);_renderT=setTimeout(renderAll,now?0:120);}

   Transition : les 3 mots de passe partagés restent possibles tant que
   le master ne les a pas coupés (Menu > Comptes et accès).
   ===================================================================== */
var AUTH_DOMAIN='brownsquadron.app';
var me={id:null,callsign:'',member_id:null,personal:false};
function slugCall(c){return String(c||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);}
function emailOfCall(c){return slugCall(c)+'@'+AUTH_DOMAIN;}
function togglePwd(){var i=$('login-pwd');i.type=i.type==='password'?'text':'password';}
function authMode(){try{return localStorage.getItem('bs_auth')||'';}catch(e){return 'anon';}}
function setAuthMode(v){try{localStorage.setItem('bs_auth',v);}catch(e){}}
function ensureSb(){if(!sb&&window.supabase&&SB_URL&&SB_KEY){try{sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){sb=null;}}return sb;}
/* rôle et identité à partir du compte connecté */
function applySession(user){
  if(!user)return false;var am=user.app_metadata||{};var role=am.role;
  if(!am.callsign||['admin','membre','lecture'].indexOf(role)<0)return false; /* comptes individuels uniquement */
  currentRole=role;
  me={id:user.id,callsign:am.callsign,member_id:am.member_id||null,personal:true,must:!!(user.user_metadata&&user.user_metadata.must_change)};
  try{localStorage.setItem('bs_gps_call',me.callsign);localStorage.setItem('bs_comms_call',me.callsign);}catch(e){}
  setAuthMode('ok');try{localStorage.setItem('bs_role',role);}catch(e){}
  return true;
}
function loginMsg(t){$('login-err').textContent=t||'';}
function showLogin(msg){
  currentRole=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');
  $('login-form').classList.remove('hidden');$('login-newpwd').classList.add('hidden');
  loginMsg(msg||'');setTimeout(function(){var f=$('login-call');if(f&&window.innerWidth>760)f.focus();},50);
}
async function tryLogin(){
  var pwd=$('login-pwd').value;var btn=$('login-go');var call=($('login-call').value||'').trim();
  if(!call){loginMsg('Entre ton indicatif.');return;}
  if(!pwd){loginMsg('Entre ton mot de passe.');return;}
  if(!ensureSb()){loginMsg('Pas de connexion internet.');return;}
  btn.disabled=true;loginMsg('Connexion…');
  try{
    var r=await withTimeout(sb.auth.signInWithPassword({email:emailOfCall(call),password:pwd}),12000);
    if(r.error||!r.data||!r.data.session){var em=(r.error&&r.error.message)||'';
      loginMsg(/banned/i.test(em)?'Accès bloqué : contacte le master.':(/fetch|network/i.test(em)?'Pas de connexion internet.':'Indicatif ou mot de passe incorrect.'));return;}
    if(!applySession(r.data.session.user)){loginMsg('Ce compte n\'a pas accès à l\'appli : contacte le master.');await sb.auth.signOut();return;}
    if(me.must){showNewPwd();return;}
    loginMsg('');startApp();
  }catch(e){loginMsg('Connexion impossible. Réessaie.');}
  finally{btn.disabled=false;}
}
/* première connexion : choisir son propre mot de passe */
function showNewPwd(){
  $('app').classList.add('hidden');$('login').classList.remove('hidden');
  $('login-form').classList.add('hidden');$('login-newpwd').classList.remove('hidden');
  $('np-who').textContent=me.callsign;$('np-err').textContent='';setTimeout(function(){$('np-1').focus();},60);
}
async function saveNewPwd(fromMenu){
  var a=$(fromMenu?'mp-1':'np-1').value,b=$(fromMenu?'mp-2':'np-2').value,err=$(fromMenu?'mp-err':'np-err');
  if(a.length<6){err.textContent='6 caractères minimum.';return;}
  if(a!==b){err.textContent='Les deux mots de passe ne sont pas identiques.';return;}
  err.textContent='Enregistrement…';
  try{var r=await withTimeout(sb.auth.updateUser({password:a,data:{must_change:false}}),12000);
    if(r.error){err.textContent=/same|different/i.test(r.error.message)?'Choisis un mot de passe différent de celui reçu.':'Erreur : '+r.error.message;return;}
    me.must=false;err.textContent='';
    if(fromMenu){closeSheet();toast('Mot de passe modifié');}else startApp();
  }catch(e){err.textContent='Pas de connexion internet.';}
}
function openChangePwd(){
  openSheet('<h3>Changer mon mot de passe</h3><div class="sub">Compte '+esc(me.callsign)+'</div>'+
    '<div class="grid1" style="margin-top:14px"><div class="field"><label>Nouveau mot de passe</label><input id="mp-1" type="password" autocomplete="new-password"></div>'+

    '<p id="mp-err" class="tiny" style="color:var(--signal);min-height:18px"></p><button class="btn primary block" onclick="saveNewPwd(true)">Enregistrer</button>');

function calShift(n){calM+=n;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}
  var cur=dOf(calSel);if(cur.getMonth()!==calM||cur.getFullYear()!==calY){calSel=(calY===new Date().getFullYear()&&calM===new Date().getMonth())?todayISO():isoOf(new Date(calY,calM,1));}renderCalendar();}

  var nb=new Date(calY,calM+1,0).getDate();var cells=Math.ceil((startDow+nb)/7)*7;

      '<button class="btn sm" onclick="calToday()">Aujourd\'hui</button>'+
      '<button class="iconbtn" onclick="calShift(1)" aria-label="Mois suivant">'+I.chev+'</button></div>'+
    '<div class="cal" id="cal-grid"><div class="dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="days">'+days+'</div></div>'+
    '<div class="legend">'+Object.keys(TYPES).map(function(k){return '<span><i style="background:'+TYPES[k].c+'"></i>'+TYPES[k].l+'</span>';}).join('')+
      '<span style="margin-left:auto"><button class="btn sm ghost" onclick="genCalendarPDF()">'+I.print+'Imprimer '+calY+'</button></span></div>'+
    '</div><div>'+
    '<div class="agenda-h"><b>'+fmtDay(calSel)+'</b><span class="tiny">'+(sel.length?sel.length+' événement'+(sel.length>1?'s':''):'')+'</span></div>'+
    '<div class="panel" style="padding:4px 14px">'+agenda+'</div>'+
    (up.length?'<div class="agenda-h"><b>Prochainement</b></div><div class="panel" style="padding:4px 14px">'+up.map(function(o){return evRow(o);}).join('')+'</div>':'')+
    '</div></div>'+

  wireCalSwipe();

function wireCalSwipe(){
  var g=$('cal-grid');if(!g)return;var x0=null,y0=null;

function compressImage(file,cb,maxDim,quality){
  maxDim=maxDim||1400;quality=quality||0.7;
  if(!file.type||file.type.indexOf('image')!==0){var r0=new FileReader();r0.onload=function(e){cb(e.target.result);};r0.readAsDataURL(file);return;}
  var r=new FileReader();
  r.onload=function(e){var img=new Image();
    img.onload=function(){var w=img.width,h=img.height;if(w>maxDim||h>maxDim){var s=Math.min(maxDim/w,maxDim/h);w=Math.round(w*s);h=Math.round(h*s);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      /* WebP (≈30 % plus léger) quand le navigateur sait l'encoder, sinon JPEG */
      try{var wp=cv.toDataURL('image/webp',quality);cb(wp.indexOf('data:image/webp')===0?wp:cv.toDataURL('image/jpeg',quality));}catch(err){cb(e.target.result);}};
    img.onerror=function(){cb(e.target.result);};img.src=e.target.result;};
  r.readAsDataURL(file);
}

/* affiche TOUTES les pages des PDF directement dans le cours (sur iPhone, l'aperçu PDF natif n'affiche souvent que la 1re page) */
function renderInlinePdfs(id){
  var boxes=[].slice.call(document.querySelectorAll('#view-cours .pdf-pages'));if(!boxes.length)return;
  ensurePdfJs().then(function(){
    boxes.reduce(function(chain,box){return chain.then(function(){
      if(curView!=='cours'||currentCoursId!==id)return;
      var b=(db[id].blocks||[])[+box.getAttribute('data-blk')];if(!b||!b.data)return;
      var bin=atob(b.data.split(',')[1]);var arr=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);
      return pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
        box.innerHTML='<div class="tiny" style="padding:6px 0">'+pdf.numPages+' page'+(pdf.numPages>1?'s':'')+'</div>';
        var seq=Promise.resolve();var w=Math.min(box.clientWidth||700,900)*(window.devicePixelRatio>1?2:1.4);
        for(var p=1;p<=pdf.numPages;p++){(function(no){seq=seq.then(function(){
          if(curView!=='cours'||currentCoursId!==id)return;
          return pdf.getPage(no).then(function(page){var v0=page.getViewport({scale:1});var vp=page.getViewport({scale:w/v0.width});
            var cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
            return page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){
              var img=new Image();img.src=cv.toDataURL('image/jpeg',0.82);img.alt='Page '+no;img.className='pdf-page';box.appendChild(img);});});});})(p);}
        return seq;
      }).catch(function(){box.innerHTML='<div class="tiny">Impossible d\'afficher les pages ici : ouvre le fichier d\'origine.</div>';});
    });},Promise.resolve());
  },function(){boxes.forEach(function(b){b.innerHTML='<div class="tiny">Aperçu indisponible hors ligne : ouvre le fichier d\'origine.</div>';});});
}
