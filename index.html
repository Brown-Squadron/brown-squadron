<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brown Squadron</title>
<meta name="theme-color" content="#0d100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brown Squadron">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   BROWN SQUADRON — OPS  ·  v3 (refonte mobile-first)
   Palette : nuit olive (AOR2 dans l'ombre), os, coyote, phosphore (vision nocturne)
   Typo : Archivo (axe largeur) — étendu pour l'identité, normal pour la lecture
   ===================================================================== */
:root{
  --night:#0d100c; --ground:#131711; --panel:#191e16; --raised:#21271d; --raised2:#2a3125;
  --hair:rgba(232,224,204,.08); --hair2:rgba(232,224,204,.15); --hair3:rgba(232,224,204,.26);
  --bone:#ebe3cf; --bone2:#b8b2a1; --bone3:#7f7b6f;
  --tan:#b49a6b; --tan2:#d4bc8c; --tan-ink:#1d1708;
  --phos:#a8efc0; --phos-dim:rgba(168,239,192,.14);
  --signal:#e2563f;
  --t-operation:#e2563f; --t-drill:#6ea7d6; --t-dominicale:#4fb3a0; --t-reunion:#a58fc9;
  --r-s:8px; --r:12px; --r-l:18px;
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --top-h:58px; --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  /* alias consommés par le module carte (code historique) */
  --mono:var(--f); --txt:var(--bone); --muted:var(--bone2); --dim:var(--bone3); --amber:var(--tan2);
  --bg2:var(--ground); --line:var(--hair); --line2:var(--hair2); --surface:var(--panel); --surface2:var(--raised); --surface3:var(--raised2);
  --op:var(--signal); --aor1:var(--tan); --aor1b:var(--tan2); --aor2:#5a6b3b; --aor2b:#859a55; --accent:var(--tan);
  --r-lg:var(--r-l);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--night);color:var(--bone);}
body{font-family:var(--f);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
img{max-width:100%;}
a{color:var(--tan2);}
:focus-visible{outline:2px solid var(--phos);outline-offset:2px;}
.hidden{display:none!important;}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;}}

/* ---------- type ---------- */
.xp{font-stretch:125%;font-weight:800;letter-spacing:-.01em;line-height:1.05;}
.h-page{font-stretch:125%;font-weight:800;font-size:26px;letter-spacing:-.015em;line-height:1.05;margin:0;}
.h-sec{font-stretch:112%;font-weight:700;font-size:15px;letter-spacing:0;color:var(--bone);margin:0 0 10px;}
.sub{color:var(--bone2);font-size:13.5px;}
.tiny{color:var(--bone3);font-size:12px;}
.num{font-variant-numeric:tabular-nums;}

/* =====================================================================
   LOGIN
   ===================================================================== */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 30%,#1a2016 0%,var(--night) 62%);z-index:50;}
#login .scope{position:absolute;width:min(130vw,780px);aspect-ratio:1;left:50%;top:42%;transform:translate(-50%,-50%);opacity:.5;pointer-events:none;}
#login .card{position:relative;width:100%;max-width:340px;text-align:center;}
#login .badge{width:118px;height:138px;margin:0 auto 18px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));}
#login .badge img{width:100%;height:100%;object-fit:contain;}
#login h1{margin:0;font-stretch:125%;font-weight:800;font-size:28px;letter-spacing:-.01em;}
#login p.lead{margin:6px 0 26px;color:var(--bone2);font-size:14px;}
.pwd{position:relative;}
.pwd input{width:100%;height:54px;border-radius:var(--r);border:1px solid var(--hair3);background:rgba(13,16,12,.8);
  padding:0 52px 0 18px;font-size:18px;letter-spacing:.18em;text-align:center;}
.pwd input:focus{outline:none;border-color:var(--phos);box-shadow:0 0 0 4px var(--phos-dim);}
.pwd button{position:absolute;right:6px;top:6px;width:42px;height:42px;border:0;background:none;color:var(--bone3);border-radius:10px;}
#login .go{margin-top:12px;width:100%;}
#login-err{min-height:22px;margin:12px 0 0;color:var(--signal);font-size:14px;}

/* =====================================================================
   BOUTONS / CHAMPS
   ===================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:var(--r);
  border:1px solid var(--hair2);background:var(--raised);font-weight:600;font-size:15px;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s;}
.btn:active{transform:scale(.98);}
.btn:hover{border-color:var(--hair3);}
.btn.primary{background:var(--tan);border-color:var(--tan);color:var(--tan-ink);font-weight:700;}
.btn.primary:hover{background:var(--tan2);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--signal);border-color:rgba(226,86,63,.35);background:transparent;}
.btn.sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:10px;}
.btn.block{width:100%;}
.btn svg{width:18px;height:18px;flex:none;}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--bone2);}
.iconbtn:hover{background:var(--raised);color:var(--bone);}
.iconbtn svg{width:21px;height:21px;}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 18px + var(--safe-b));z-index:30;height:54px;padding:0 22px 0 18px;border-radius:16px;
  border:0;background:var(--tan);color:var(--tan-ink);font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.45);}
.fab svg{width:22px;height:22px;}
@media (min-width:960px){.fab{bottom:28px;right:32px;}}

.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field>label,.lbl{font-size:13px;color:var(--bone2);font-weight:500;}
.inp,.field input,.field select,.field textarea{width:100%;min-height:48px;border-radius:var(--r);border:1px solid var(--hair2);background:var(--ground);
  padding:11px 14px;font-size:16px;color:var(--bone);}
.field textarea{min-height:110px;resize:vertical;line-height:1.5;}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--tan);box-shadow:0 0 0 3px rgba(180,154,107,.18);}
.field input:disabled,.field textarea:disabled,.field select:disabled{opacity:.6;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid1{display:grid;gap:12px;}
@media (max-width:520px){.grid2.stack{grid-template-columns:1fr;}}
.search{position:relative;}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--hair);background:var(--panel);padding:0 14px 0 42px;font-size:16px;}
.search input:focus{outline:none;border-color:var(--hair3);}
.search svg{position:absolute;left:14px;top:13px;width:19px;height:19px;color:var(--bone3);}

/* segmented control */
.seg{display:flex;background:var(--ground);border:1px solid var(--hair);border-radius:13px;padding:4px;gap:4px;}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--bone2);font-weight:600;font-size:14px;padding:0 10px;}
.seg button.on{background:var(--raised2);color:var(--bone);box-shadow:0 1px 0 var(--hair3) inset;}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--hair2);background:transparent;color:var(--bone2);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;}
.chip.on{background:var(--bone);color:var(--night);border-color:var(--bone);}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* =====================================================================
   COQUE APP
   ===================================================================== */
#app{min-height:100dvh;}
.topbar{position:sticky;top:0;z-index:40;height:calc(var(--top-h) + var(--safe-t));padding:var(--safe-t) 10px 0 16px;display:flex;align-items:center;gap:10px;
  background:rgba(13,16,12,.86);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--hair);}
.topbar .logo{width:30px;height:34px;flex:none;}
.topbar .logo img{width:100%;height:100%;object-fit:contain;}
.topbar .ttl{flex:1;min-width:0;font-stretch:125%;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .back{margin-left:-8px;}
.sync{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--hair);font-size:12px;color:var(--bone2);background:transparent;}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--bone3);}
.sync.ok i{background:var(--phos);box-shadow:0 0 8px var(--phos);}
.sync.busy i{background:var(--tan);animation:pulse 1s ease-in-out infinite;}
.sync.warn i{background:var(--signal);}
@keyframes pulse{50%{opacity:.25;}}
.role-pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--hair2);color:var(--bone2);}
.role-pill.admin{color:var(--tan2);border-color:rgba(180,154,107,.45);}

main{padding:16px 16px calc(var(--nav-h) + 96px + var(--safe-b));max-width:1120px;margin:0 auto;}
.view{display:none;}
.view.on{display:block;animation:viewin .22s ease-out;}
@keyframes viewin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px;}
.page-head .sub{margin-top:4px;}

/* bottom nav (mobile) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;
  background:rgba(16,20,14,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--hair);}
.nav button{flex:1;border:0;background:none;color:var(--bone3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;position:relative;}
.nav button svg{width:23px;height:23px;}
.nav button.on{color:var(--bone);}
.nav button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--phos);box-shadow:0 0 10px var(--phos);}
/* rail (desktop) */
@media (min-width:960px){
  .nav{top:0;bottom:0;right:auto;width:92px;height:auto;flex-direction:column;justify-content:flex-start;padding:calc(var(--top-h) + 14px) 0 14px;border-top:0;border-right:1px solid var(--hair);gap:4px;}
  .nav button{flex:none;height:68px;}
  .nav button.on:before{top:16px;bottom:16px;left:0;right:auto;width:2px;height:auto;}
  .nav .more-only{display:none;}
  .nav .desk-only{display:flex!important;}
  #app{padding-left:92px;}
  .topbar{z-index:46;}
  main{padding:24px 32px 60px;}
}
.nav .desk-only{display:none;}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;}
.sheet-bg.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:88dvh;overflow:auto;background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;
  border:1px solid var(--hair2);border-bottom:0;padding:10px 16px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);}
.sheet.on{transform:none;}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--hair3);margin:2px auto 14px;}
.sheet h3{margin:0 0 4px;font-stretch:118%;font-weight:800;font-size:19px;}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;transform:translate(-50%,calc(100% + 60px));bottom:24px;border-radius:22px;border-bottom:1px solid var(--hair2);}
  .sheet.on{transform:translate(-50%,0);}}
.menu-list{display:flex;flex-direction:column;gap:2px;margin-top:8px;}
.menu-item{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 12px;border-radius:14px;border:0;background:none;text-align:left;font-size:16px;font-weight:600;}
.menu-item:hover,.menu-item:active{background:var(--raised);}
.menu-item svg{width:22px;height:22px;color:var(--tan2);flex:none;}
.menu-item .r{margin-left:auto;color:var(--bone3);font-size:13px;font-weight:500;}

/* toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + var(--safe-b));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px;}
.toast{background:var(--bone);color:var(--night);font-weight:600;font-size:14px;padding:12px 16px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:tin .2s ease-out;}
.toast.err{background:var(--signal);color:#fff;}
@keyframes tin{from{opacity:0;transform:translateY(8px);}}

/* =====================================================================
   BLOCS GÉNÉRIQUES
   ===================================================================== */
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-l);padding:16px;}
.panel+.panel{margin-top:12px;}
.stack>*+*{margin-top:12px;}
.row{display:flex;align-items:center;gap:12px;}
.between{justify-content:space-between;}
.list{display:flex;flex-direction:column;}
.empty{text-align:center;padding:44px 20px;color:var(--bone2);}
.empty b{display:block;color:var(--bone);font-stretch:112%;font-size:17px;margin-bottom:6px;}
.empty .btn{margin-top:16px;}
.bar{height:6px;border-radius:6px;background:var(--hair);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:6px;background:var(--tan);transition:width .5s ease;}
.bar.phos i{background:var(--phos);}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--bone2);}
.tag i{width:7px;height:7px;border-radius:50%;}
.divider{height:1px;background:var(--hair);margin:16px 0;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px;}
.kv dt{color:var(--bone3);}
.kv dd{margin:0;}
.avatar{width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-stretch:125%;font-weight:800;font-size:15px;
  background:var(--raised2);color:var(--tan2);border:1px solid var(--hair);}
.save-bar{position:sticky;bottom:calc(var(--nav-h) + 10px + var(--safe-b));z-index:20;margin-top:18px;display:flex;gap:10px;padding:10px;border-radius:18px;
  background:rgba(25,30,22,.92);backdrop-filter:blur(12px);border:1px solid var(--hair2);}
.save-bar .btn{flex:1;}
@media (min-width:960px){.save-bar{bottom:16px;}}
.status-line{font-size:13px;color:var(--bone2);min-height:18px;margin-top:8px;text-align:center;}

/* =====================================================================
   ACCUEIL
   ===================================================================== */
.hero{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--hair2);padding:22px 20px 20px;
  background:radial-gradient(130% 100% at 85% 0%,#1f2a1c 0%,#141a12 55%,#10140e 100%);cursor:pointer;}
.hero .reticle{position:absolute;right:-70px;top:-60px;width:300px;height:300px;opacity:.55;pointer-events:none;}
.hero .eyebrow{font-size:13px;color:var(--bone2);display:flex;align-items:center;gap:8px;}
.hero .live{width:8px;height:8px;border-radius:50%;background:var(--phos);box-shadow:0 0 10px var(--phos);}
.hero .t{font-stretch:125%;font-weight:800;font-size:clamp(28px,8vw,46px);line-height:1;letter-spacing:-.02em;margin:14px 0 8px;max-width:14ch;word-break:break-word;}
.hero .when{color:var(--bone2);font-size:15px;}
.hero .count{display:flex;align-items:baseline;gap:8px;margin-top:22px;}
.hero .count .n{font-stretch:125%;font-weight:800;font-size:64px;line-height:.9;color:var(--phos);text-shadow:0 0 24px rgba(168,239,192,.35);}
.hero .count .u{color:var(--bone2);font-size:14px;max-width:12ch;line-height:1.25;}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.stat{background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:14px;}
.stat .v{font-stretch:125%;font-weight:800;font-size:26px;line-height:1;}
.stat .v small{font-size:14px;color:var(--bone3);font-weight:700;margin-left:2px;}
.stat .l{font-size:12.5px;color:var(--bone2);margin-top:6px;}
.stat .bar{margin-top:10px;height:4px;}
.home-grid{display:grid;gap:12px;margin-top:12px;}
@media (min-width:960px){.home-grid{grid-template-columns:1.3fr 1fr;}.hero{padding:34px 34px 30px;}.hero .reticle{width:420px;height:420px;right:-60px;top:-90px;}}

/* ligne événement (accueil, calendrier, ops) */
.ev{display:flex;align-items:stretch;gap:14px;padding:12px 4px;border-bottom:1px solid var(--hair);cursor:pointer;}
.ev:last-child{border-bottom:0;}
.ev .d{width:52px;flex:none;text-align:center;border-radius:14px;background:var(--ground);border:1px solid var(--hair);padding:7px 0 6px;position:relative;overflow:hidden;}
.ev .d:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--tan));}
.ev .d b{display:block;font-stretch:125%;font-weight:800;font-size:21px;line-height:1;}
.ev .d span{font-size:11px;color:var(--bone2);font-weight:600;text-transform:lowercase;}
.ev .m{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.ev .m .n{font-weight:700;font-size:15.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev .m .s{font-size:13px;color:var(--bone2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev .x{display:flex;align-items:center;color:var(--bone3);font-size:13px;gap:4px;}

/* =====================================================================
   MEMBRES
   ===================================================================== */
.mem{display:flex;align-items:center;gap:13px;padding:12px 12px;cursor:pointer;background:var(--panel);border:1px solid var(--hair2);border-radius:16px;margin-bottom:10px;transition:border-color .15s,background .15s;}
.mem:hover{border-color:var(--hair3);background:#1c2219;}
#view-membres .mem{position:relative;}
#view-membres .mem:before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--tan);opacity:.55;}
.sheet .mem{background:transparent;border:0;border-bottom:1px solid var(--hair);border-radius:0;margin:0;padding:12px 4px;}
.sheet .mem:before{display:none;}
.avatar.editable{cursor:pointer;position:relative;}
.avatar.editable:hover{border-color:var(--tan);}
.avatar.editable:after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--tan);border:2px solid var(--panel);}
.mem .info{flex:1;min-width:0;}
.mem .cs{font-stretch:118%;font-weight:800;font-size:16px;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mem .nm{font-size:13px;color:var(--bone2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mem .bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--bone3);max-width:280px;}
.mem .bars .bar{height:4px;}
.mem .bars b{color:var(--bone2);font-weight:700;min-width:30px;text-align:right;}
.pam{display:flex;gap:5px;flex:none;}
.pam button{width:30px;height:30px;border-radius:10px;border:1px solid var(--hair2);background:var(--ground);font-size:12px;font-weight:800;color:var(--bone3);padding:0;}
.pam button.g{background:#2f6b3c;border-color:#4f9a5d;color:#e8ffe9;}
.pam button.y{background:#7a6418;border-color:#c09c2a;color:#fff6d6;}
.pam button.r{background:#7a2a20;border-color:#c24a37;color:#ffe3de;}
.mem-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
@media (min-width:960px){.mem-cols{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;}}

/* fiche */
.fiche-head{display:flex;align-items:center;gap:14px;margin:4px 0 16px;}
.fiche-head .avatar{width:58px;height:58px;font-size:20px;border-radius:18px;}
.fiche-head .cs{font-stretch:125%;font-weight:800;font-size:24px;line-height:1.05;text-transform:uppercase;word-break:break-word;}
.score{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:14px;}
.score .stat .v{color:var(--phos);}
.drill-admin{display:flex;align-items:center;gap:10px;margin-top:10px;}
.drill-admin input{width:96px;height:44px;border-radius:12px;border:1px solid var(--hair3);background:var(--ground);text-align:center;font-size:18px;font-weight:800;}
.drill-admin input:focus{outline:none;border-color:var(--phos);}
.tabs{position:sticky;top:calc(var(--top-h) + var(--safe-t));z-index:15;background:var(--night);padding:8px 0;margin:0 0 6px;}

/* kit */
.kit-legend{font-size:13px;color:var(--bone2);margin:10px 2px 6px;}
.kit-legend .star{color:var(--tan2);}
.kit{display:flex;flex-direction:column;}
.ki{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 2px;border-bottom:1px solid var(--hair);}
.ki.sub{padding-left:26px;min-height:46px;}
.ki.sub .kn{font-size:14px;color:var(--bone2);}
.ck{width:28px;height:28px;flex:none;border-radius:9px;border:1.5px solid var(--hair3);background:var(--ground);display:flex;align-items:center;justify-content:center;padding:0;}
.ck svg{width:16px;height:16px;opacity:0;color:var(--night);}
.ki.has>.ck,.ck.on{background:var(--phos);border-color:var(--phos);}
.ki.has>.ck svg,.ck.on svg{opacity:1;}
.kn{flex:1;min-width:0;font-size:15px;line-height:1.3;}
.kn .fold{display:block;font-size:12px;color:var(--bone3);background:none;border:0;padding:2px 0 0;}
.kq{width:58px;height:38px;flex:none;border-radius:10px;border:1px solid var(--hair2);background:var(--ground);text-align:center;font-size:15px;}
.kq:focus{outline:none;border-color:var(--tan);}
.star-btn{width:36px;height:36px;flex:none;border:0;background:none;border-radius:10px;color:var(--bone3);padding:0;display:flex;align-items:center;justify-content:center;}
.star-btn svg{width:21px;height:21px;}
.star-btn.on{color:var(--tan2);}
.star-btn.on svg{fill:currentColor;}
.kdel{width:32px;height:32px;flex:none;border:0;background:none;color:var(--bone3);border-radius:8px;padding:0;}
.kdel:hover{color:var(--signal);}
.kit-add{display:flex;gap:8px;margin-top:10px;}
.kit-add input{flex:1;height:44px;border-radius:12px;border:1px dashed var(--hair3);background:transparent;padding:0 12px;font-size:15px;}
.ki .grip{width:24px;flex:none;color:var(--bone3);cursor:grab;touch-action:none;text-align:center;}
.ki.dragging{opacity:.4;}
.ki.drop-above{box-shadow:0 -2px 0 var(--tan) inset;}

.photo{position:relative;border-radius:14px;border:1px dashed var(--hair3);background:var(--ground);aspect-ratio:16/10;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--bone3);font-size:14px;cursor:pointer;}
.photo img{width:100%;height:100%;object-fit:cover;}
.photo .x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:10px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;}

/* =====================================================================
   CALENDRIER
   ===================================================================== */
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:12px;}
.cal-head .mname{flex:1;font-stretch:125%;font-weight:800;font-size:24px;letter-spacing:-.015em;text-transform:capitalize;}
.cal-head .mname small{font-stretch:100%;font-weight:600;font-size:15px;color:var(--bone3);margin-left:6px;}
.cal{background:var(--panel);border:1px solid var(--hair);border-radius:22px;padding:10px 8px 12px;touch-action:pan-y;user-select:none;}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--bone3);font-weight:600;padding:4px 0 8px;}
.cal .days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;}
.cal .day{position:relative;height:48px;border:0;background:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;font-size:16px;font-weight:600;color:var(--bone);}
.cal .day.out{color:var(--bone3);opacity:.45;}
.cal .day.today{color:var(--phos);}
.cal .day.today:after{content:"";position:absolute;top:31px;width:4px;height:4px;border-radius:50%;background:var(--phos);display:none;}
.cal .day.sel{background:var(--bone);color:var(--night);}
.cal .day .dots{display:flex;gap:3px;margin-top:5px;height:6px;}
.cal .day .dots i{width:6px;height:6px;border-radius:50%;}
.cal .day.range{background:rgba(232,224,204,.05);}
.cal .day.sel.range{background:var(--bone);}
.agenda-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 6px;}
.agenda-h b{font-stretch:112%;font-size:16px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--bone2);margin:12px 4px 0;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:8px;height:8px;border-radius:50%;}
@media (min-width:960px){.cal-layout{display:grid;grid-template-columns:minmax(420px,1fr) 1fr;gap:28px;align-items:start;}.cal .day{height:64px;}.agenda-h{margin-top:4px;}}

/* =====================================================================
   OPÉRATIONS
   ===================================================================== */
.op-card{display:block;position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--hair);background:var(--panel);padding:16px 16px 14px 18px;margin-bottom:10px;cursor:pointer;}
.op-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--tan));}
.op-card .top{display:flex;align-items:center;gap:10px;}
.op-card .date{font-size:13px;color:var(--bone2);font-weight:600;}
.op-card .n{font-stretch:118%;font-weight:800;font-size:20px;line-height:1.15;margin:8px 0 6px;word-break:break-word;}
.op-card .s{font-size:13.5px;color:var(--bone2);display:flex;flex-wrap:wrap;gap:4px 14px;}
.op-card .s span{display:inline-flex;align-items:center;gap:5px;}
.op-card .s svg{width:15px;height:15px;color:var(--bone3);}
.op-card.past{opacity:.62;}
.faces{display:flex;margin-left:auto;}
.faces span{width:26px;height:26px;border-radius:9px;background:var(--raised2);border:2px solid var(--panel);margin-left:-7px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--tan2);}
.faces span.more{color:var(--bone2);}
.grp-title{font-size:13px;font-weight:700;color:var(--bone3);margin:18px 4px 8px;}
@media (min-width:960px){.op-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}}

/* fiche op (lecture) */
.op-hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px;border:1px solid var(--hair2);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c,#b49a6b) 22%,#151a13) 0%,#141912 60%);}
.op-hero .t{font-stretch:125%;font-weight:800;font-size:clamp(26px,7.4vw,40px);line-height:1.02;letter-spacing:-.02em;margin:12px 0 10px;word-break:break-word;}
.op-hero .when{font-size:15px;color:var(--bone);}
.op-hero .where{font-size:14px;color:var(--bone2);margin-top:4px;}
.op-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.prose{white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.6;color:var(--bone);}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
.doc{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--hair2);background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;cursor:pointer;text-align:center;font-size:11.5px;color:var(--bone2);}
.doc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.doc svg{width:28px;height:28px;color:var(--tan2);}
.doc .x{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:9px;border:0;background:rgba(0,0,0,.65);color:#fff;z-index:2;}
.doc span{word-break:break-all;line-height:1.2;max-height:3.6em;overflow:hidden;}
.drop{border:1.5px dashed var(--hair3);border-radius:16px;padding:20px;text-align:center;color:var(--bone2);cursor:pointer;margin-bottom:12px;}
.drop.over{border-color:var(--phos);color:var(--phos);}
.pres{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--hair);cursor:pointer;}
.pres:last-child{border-bottom:0;}
.pres .avatar{width:38px;height:38px;border-radius:12px;font-size:13px;}
.pres .info{flex:1;min-width:0;}
.pres .info b{display:block;font-weight:700;text-transform:uppercase;font-stretch:112%;}
.pres .info span{font-size:12.5px;color:var(--bone2);}
.pres.on .avatar{background:var(--phos);color:var(--night);}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.typepick button{min-height:52px;border-radius:14px;border:1px solid var(--hair2);background:var(--ground);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:600;}
.typepick button i{width:10px;height:10px;border-radius:50%;}
.typepick button.on{border-color:var(--bone);background:var(--raised2);}

/* =====================================================================
   DRILL
   ===================================================================== */
.course{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--hair);background:var(--panel);margin-bottom:10px;cursor:pointer;}
.course .ic{width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(110,167,214,.12);color:var(--t-drill);}
.course .ic svg{width:22px;height:22px;}
.course .info{flex:1;min-width:0;}
.course .info b{display:block;font-weight:700;font-size:16px;line-height:1.25;}
.course .info span{font-size:13px;color:var(--bone2);}
.reader{max-width:720px;}
.reader .h{font-stretch:125%;font-weight:800;font-size:clamp(26px,7vw,38px);line-height:1.04;letter-spacing:-.02em;margin:10px 0 8px;}
.reader figure{margin:18px 0;}
.reader figure img{border-radius:16px;display:block;width:100%;}
.reader figcaption{font-size:13px;color:var(--bone2);margin-top:8px;}
.reader .video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;margin:18px 0;background:#000;}
.reader .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.reader .pdf{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--hair2);margin:14px 0;cursor:pointer;}
.reader .pdf svg{width:26px;height:26px;color:var(--tan2);}
.blk{border:1px solid var(--hair2);border-radius:16px;padding:10px;margin-bottom:10px;background:var(--ground);}
.blk .bt{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;color:var(--bone2);font-weight:600;}
.blk .bt .sp{flex:1;}
.blk textarea{width:100%;min-height:120px;border:0;background:transparent;font-size:16px;line-height:1.55;resize:vertical;padding:4px;}
.blk textarea:focus{outline:none;}
.blk img{border-radius:12px;display:block;}
.blk input{width:100%;height:42px;margin-top:8px;border-radius:10px;border:1px solid var(--hair);background:var(--panel);padding:0 12px;font-size:15px;}
.addbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* =====================================================================
   COMMS
   ===================================================================== */
.conv{display:flex;align-items:center;gap:13px;padding:12px 6px;border-bottom:1px solid var(--hair);cursor:pointer;}
.conv .avatar{border-radius:50%;}
.conv .info{flex:1;min-width:0;}
.conv .info b{display:block;font-weight:700;font-size:16px;}
.conv .info span{display:block;font-size:13.5px;color:var(--bone2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat{display:flex;flex-direction:column;height:calc(100dvh - var(--top-h) - var(--safe-t) - var(--nav-h) - var(--safe-b));margin:-16px -16px 0;}
.chat .log{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:4px;}
.msg{max-width:82%;align-self:flex-start;background:var(--raised);border-radius:18px 18px 18px 6px;padding:8px 12px 6px;position:relative;}
.msg .w{font-size:12px;font-weight:800;color:var(--tan2);margin-bottom:2px;text-transform:uppercase;font-stretch:112%;}
.msg .b{font-size:15.5px;white-space:pre-wrap;word-break:break-word;}
.msg .t{font-size:11px;color:var(--bone3);text-align:right;margin-top:2px;}
.msg.me{align-self:flex-end;background:#2c3a2a;border-radius:18px 18px 6px 18px;}
.msg.me .w{display:none;}
.msg.cont{margin-top:-1px;}
.msg .del{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--hair2);background:var(--panel);color:var(--bone3);font-size:13px;display:none;padding:0;}
.msg:hover .del,.msg.sel .del{display:block;}
.day-sep{align-self:center;font-size:12px;color:var(--bone3);margin:12px 0 6px;padding:3px 10px;border-radius:999px;background:var(--ground);}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--hair);background:var(--panel);}
.composer textarea{flex:1;min-height:46px;max-height:140px;border-radius:22px;border:1px solid var(--hair2);background:var(--ground);padding:12px 16px;font-size:16px;resize:none;line-height:1.35;}
.composer textarea:focus{outline:none;border-color:var(--hair3);}
.composer .send{width:46px;height:46px;border-radius:50%;border:0;background:var(--tan);color:var(--tan-ink);flex:none;display:flex;align-items:center;justify-content:center;}
.composer .send svg{width:20px;height:20px;}
.callsign-chip{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--hair2);background:transparent;font-size:12.5px;font-weight:700;color:var(--tan2);}
@media (min-width:960px){.chat{margin:-24px -32px 0;height:calc(100dvh - var(--top-h));}}

/* =====================================================================
   ÉVAL BULL
   ===================================================================== */
.cand{padding:14px;border-radius:18px;border:1px solid var(--hair);background:var(--panel);margin-bottom:10px;cursor:pointer;}
.cand .top{display:flex;align-items:center;gap:12px;}
.cand .top b{flex:1;font-stretch:118%;font-weight:800;font-size:17px;}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px;}
.steps div{height:5px;border-radius:5px;background:var(--hair2);}
.steps div.done{background:var(--phos);}
.steps div.cur{background:var(--tan);}
.steps-l{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px;font-size:11.5px;color:var(--bone3);}
.crit{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--hair);}
.crit:last-child{border-bottom:0;}
.crit .info{flex:1;min-width:0;}
.crit .info b{display:block;font-weight:700;font-size:15px;}
.crit .info span{font-size:13px;color:var(--bone2);}
.crit input[type=date]{width:auto;min-height:38px;height:38px;padding:0 8px;font-size:13px;border-radius:10px;border:1px solid var(--hair2);background:var(--ground);margin-top:8px;color:var(--bone2);}
.toggle{position:relative;width:52px;height:32px;flex:none;}
.toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2;}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--raised2);border:1px solid var(--hair2);transition:.2s;}
.toggle span:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--bone2);transition:.2s;}
.toggle input:checked+span{background:var(--phos);border-color:var(--phos);}
.toggle input:checked+span:after{transform:translateX(20px);background:var(--night);}
.choice{display:flex;gap:8px;flex-wrap:wrap;}
.choice button{flex:1;min-height:46px;min-width:90px;border-radius:12px;border:1px solid var(--hair2);background:var(--ground);font-weight:700;}
.choice button.on{background:var(--bone);color:var(--night);border-color:var(--bone);}
.choice button.on.bad{background:var(--signal);border-color:var(--signal);color:#fff;}

#blackout-veil{position:fixed;inset:0;background:#000;z-index:2147483647;display:none;touch-action:none;}
#blackout-veil .bo-hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);color:#151515;font-size:10px;}
#blackout-veil .bo-gps{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#0a2a0a;}
#pdf-wait{display:none;position:fixed;inset:0;z-index:99998;background:rgba(7,9,6,.92);align-items:center;justify-content:center;}
#pdf-wait .pw-box{text-align:center;}
#pdf-wait .pw-spin{width:48px;height:48px;margin:0 auto 16px;border-radius:50%;border:3px solid var(--hair2);border-top-color:var(--phos);animation:spin 1s linear infinite;}
#pdf-wait .pw-txt{font-weight:800;color:var(--bone);}
#pdf-wait .pw-sub{font-size:13px;color:var(--bone2);margin-top:4px;}
@keyframes spin{to{transform:rotate(360deg);}}
#doc-pop{position:fixed;inset:0;z-index:9600;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:12px;}
#doc-pop.show{display:flex;}
#doc-pop img{max-width:100%;max-height:80dvh;border-radius:12px;}
#doc-pop iframe{width:min(900px,96vw);height:78dvh;border:0;border-radius:12px;background:#fff;}
/* droits par rôle */
body:not(.role-admin) .admin-only{display:none!important;}
body.role-lecture .edit-only{display:none!important;}
body[data-view=chat] main{padding-bottom:0;}
body[data-view=chat] #toasts{bottom:calc(var(--nav-h) + 90px + var(--safe-b));}
@media (min-width:960px){body[data-view=chat] main{padding-bottom:0;}}
a.btn{text-decoration:none;color:inherit;}
.sheet:not(.on){visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;}
.pdf-pages .pdf-page{display:block;width:100%;border-radius:10px;margin:0 0 10px;background:#fff;}
.score .chips{flex-wrap:wrap;}

/* =====================================================================
   CARTE v4
   ===================================================================== */
body[data-view=map] main{padding:0;max-width:none;}
.mp{position:relative;height:calc(100dvh - var(--top-h) - var(--safe-t) - var(--nav-h) - var(--safe-b));background:#0a0d08;overflow:hidden;}
@media (min-width:960px){.mp{height:calc(100dvh - var(--top-h) - var(--safe-t));}}
body.map-fs .topbar,body.map-fs .nav{display:none;}
body.map-fs #app{padding-left:0;}
body.map-fs .mp{position:fixed;inset:0;height:100dvh;z-index:60;}
#map-canvas{position:absolute;inset:0;}
.maplibregl-ctrl-top-right{top:calc(8px);right:4px;}
.maplibregl-ctrl-group{background:rgba(25,30,22,.92)!important;border:1px solid var(--hair2);border-radius:12px!important;box-shadow:none!important;}
.maplibregl-ctrl-group button{width:38px!important;height:38px!important;}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--hair)!important;}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(.92);}
.maplibregl-ctrl-attrib{background:rgba(13,16,12,.7)!important;color:var(--bone3);font-size:10px;}
.maplibregl-ctrl-attrib a{color:var(--bone2)!important;}
.mp-top{position:absolute;left:10px;top:10px;right:60px;z-index:5;display:flex;gap:8px;pointer-events:none;}
.mp-folder{pointer-events:auto;display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 12px;border-radius:13px;background:rgba(25,30,22,.92);border:1px solid var(--hair2);max-width:100%;backdrop-filter:blur(8px);}
.mp-folder span{font-size:12px;color:var(--bone3);font-weight:600;}
.mp-folder select{border:0;background:transparent;font-weight:700;font-size:14px;max-width:52vw;padding:0 4px;color:var(--bone);}
.mp-folder select option{background:var(--panel);}
.mp-side{position:absolute;right:4px;top:136px;z-index:5;display:flex;flex-direction:column;gap:8px;}
.mp-fab{width:40px;height:40px;border-radius:12px;border:1px solid var(--hair2);background:rgba(25,30,22,.92);color:var(--bone);display:flex;align-items:center;justify-content:center;padding:0;backdrop-filter:blur(8px);}
.mp-fab svg{width:21px;height:21px;}
.mp-fab.live{background:var(--signal);border-color:var(--signal);color:#fff;animation:gpspulse 1.6s infinite;}
@keyframes gpspulse{0%,100%{box-shadow:0 0 0 0 rgba(226,86,63,.55);}50%{box-shadow:0 0 0 8px rgba(226,86,63,0);}}
.mp-dock{position:absolute;left:8px;right:8px;bottom:calc(8px + (var(--safe-b) * 0));z-index:6;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
body.map-fs .mp-dock{bottom:calc(10px + var(--safe-b));}
.mp-dock>*{pointer-events:auto;}
.mp-hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:16px;background:rgba(232,224,204,.96);color:var(--night);font-size:14px;font-weight:600;}
.mp-hint .t{flex:1;min-width:150px;}
.mp-hint .b{display:flex;gap:6px;margin-left:auto;}
.mp-hint .btn.ghost{border-color:rgba(13,16,12,.25);color:var(--night);}
.mp-hint .btn.primary{background:var(--night);border-color:var(--night);color:var(--bone);}
.mp-hint .btn:disabled{opacity:.35;}
.mp-tray{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px;border-radius:18px;background:rgba(19,23,17,.94);border:1px solid var(--hair2);backdrop-filter:blur(10px);}
.mp-tray::-webkit-scrollbar{display:none;}
.mp-tool{flex:1 0 auto;min-width:62px;height:58px;border-radius:13px;border:0;background:transparent;color:var(--bone);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;padding:0 8px;}
.mp-tool svg{width:22px;height:22px;}
.mp-tool.on{background:var(--tan);color:var(--tan-ink);}
.mp-tool:disabled{opacity:.3;}
.mp-tool .mp-sym{width:28px;height:28px;display:block;}
.mp-tool .mp-sym svg{width:28px;height:28px;}
.mp-tool.tac.on{background:var(--bone);color:var(--night);}
.mp-dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:block;}
.mp-modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:15px;background:rgba(19,23,17,.94);border:1px solid var(--hair2);}
.mp-modes button{height:38px;border:0;border-radius:11px;background:transparent;color:var(--bone2);font-weight:700;font-size:13.5px;}
.mp-modes button.on{background:var(--raised2);color:var(--bone);}
@media (min-width:960px){.mp-dock{left:50%;right:auto;transform:translateX(-50%);width:560px;bottom:16px;}}
.mp-colors{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;}
.mp-colors button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--hair3);}
.mp-colors button.on{border-color:var(--night);box-shadow:0 0 0 3px var(--bone);}
.mp-colors.sm{margin-top:4px;gap:8px;}
.mp-colors.sm button{width:32px;height:32px;}
.map-search{display:flex;gap:8px;}
.map-search input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--hair2);background:var(--ground);padding:0 14px;font-size:16px;}
.map-search button{height:46px;border-radius:12px;border:1px solid var(--hair2);background:var(--raised);padding:0 16px;font-weight:700;}
.mp-row{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--hair);}
.mp-row-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:11px 4px;border:0;background:none;text-align:left;font-size:14.5px;}
.mp-row-main i{width:12px;height:12px;border-radius:50%;flex:none;}
.mp-row-main span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mp-row-main small{color:var(--bone3);font-size:12px;flex:none;}
/* marqueurs : aucune propriété transform sur la racine */
.mk-ping{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.mk-ping i{display:block;width:18px;height:18px;border-radius:50% 50% 50% 0;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.6);rotate:-45deg;margin-bottom:4px;}
.mk-ping .n,.mk-sym .n,.mk-op span{margin-bottom:4px;background:rgba(13,16,12,.9);color:var(--bone);font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--hair2);}
.mk-sym{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.mk-sym .s{display:block;width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7));}
.mk-sym .s svg{width:34px;height:34px;display:block;}
.mk-sym .s.bs{border-radius:50%;background:var(--aor2);border:2px solid #fff;display:flex;align-items:center;justify-content:center;width:30px;height:30px;}
.mk-sym .s.bs img{width:72%;}
.mk-sym .n{margin:4px 0 0;}
.mk-sym.k-medic .s{animation:medpulse 1.8s ease-in-out infinite;border-radius:50%;}
@keyframes medpulse{0%,100%{box-shadow:0 0 0 0 rgba(226,86,63,.7);}50%{box-shadow:0 0 0 10px rgba(226,86,63,0);}}
.mk-op{display:flex;flex-direction:column-reverse;align-items:center;cursor:pointer;}
.mk-op i{display:block;width:26px;height:26px;border-radius:50%;border:3px solid #e2563f;box-shadow:0 0 0 2px rgba(0,0,0,.5),inset 0 0 0 4px rgba(226,86,63,.25);background:radial-gradient(circle,#e2563f 0 3px,transparent 4px);}
.mk-op span{margin:0 0 4px;border-color:rgba(226,86,63,.6);}
.mk-lbl{background:rgba(13,16,12,.9);border:1px solid var(--tan);color:var(--tan2);font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap;cursor:pointer;}
.mk-gps{position:relative;width:26px;height:26px;cursor:default;}
.mk-gps .dot{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;border:3px solid #fff;}
.mk-gps .arrow{position:absolute;left:50%;top:-12px;margin-left:-7px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:13px solid #46b29d;transform-origin:50% 25px;}
.mk-gps .n{position:absolute;left:50%;top:30px;translate:-50% 0;background:rgba(13,16,12,.92);color:#fff;font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap;line-height:1.35;text-align:center;border:1px solid var(--hair2);}
.mk-gps.me .dot{border-color:var(--phos);}
.mk-gps.grp{cursor:pointer;width:32px;height:32px;}
.mk-gps.grp .dot{left:0;top:0;width:32px;height:32px;background:var(--bone);color:var(--night);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;border:3px solid #46b29d;}
.mk-gps.grp .n{top:36px;}
body[data-view=map] #toasts{top:calc(var(--top-h) + var(--safe-t) + 62px);bottom:auto;}
body.map-fs #toasts{top:calc(var(--safe-t) + 62px);}
body[data-view=map] .toast{font-size:13px;padding:9px 13px;}
.mp-tool{height:52px;}
.mp-hint{padding:8px 10px;font-size:13.5px;}
.mp.drawing .maplibregl-marker{pointer-events:none;}
.mp-tool{flex:1 1 0;min-width:46px;padding:0 2px;font-size:10.5px;}
@media (min-width:420px){.mp-tool{font-size:11.5px;}}
/* étiquettes de distance / surface */
.mk-dist{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 0;border-radius:9px;background:rgba(13,16,12,.92);border:1px solid rgba(232,224,204,.22);color:#fff;cursor:pointer;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.45);overflow:hidden;}
.mk-dist i{align-self:stretch;width:5px;flex:none;}
.mk-dist svg{width:15px;height:15px;color:var(--bone2);flex:none;margin-left:3px;}
.mk-dist b{font-size:13.5px;font-weight:800;letter-spacing:.01em;}
.mk-dist small{font-size:11px;color:var(--bone3);font-weight:600;padding-left:6px;border-left:1px solid var(--hair2);}
.mk-dist.live{background:rgba(232,224,204,.97);color:var(--night);border-color:transparent;pointer-events:none;}
.mk-dist.live svg,.mk-dist.live small{color:#4a4a3e;}
.mk-dist.live small{border-left-color:rgba(0,0,0,.15);}
.mk-sym .s{position:relative;}
.mk-sym .s em{position:absolute;left:24px;top:-6px;font-style:normal;font-size:10px;font-weight:800;background:rgba(13,16,12,.92);color:#fff;border-radius:6px;padding:1px 5px;border:1px solid var(--hair2);white-space:nowrap;}
.mp-fromme{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--ground);border:1px solid var(--hair2);font-size:14px;}
.mp-fromme b{font-size:16px;}
.mp-coord{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;height:44px;padding:0 12px;border-radius:12px;border:1px dashed var(--hair3);background:transparent;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.mp-coord span{font-size:12px;color:var(--tan2);font-weight:700;}
#blackout-veil .pk{position:absolute;left:0;right:0;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:6px;color:#2a2a2a;font-size:12px;text-align:center;padding:0 30px;pointer-events:none;}
#blackout-veil .pk b{font-size:14px;color:#333;}
.mp-fab.bg{border-color:var(--phos);color:var(--phos);box-shadow:0 0 0 2px rgba(168,239,192,.25);}
.mp-status{margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--hair2);background:var(--ground);display:flex;flex-direction:column;gap:4px;}
.mp-status b{font-size:15px;}
.mp-status span{font-size:13px;color:var(--bone2);}
.mp-status .btn{align-self:flex-start;margin-top:6px;}
.mp-status.ok{border-color:var(--phos);}
.mp-status.ok b{color:var(--phos);}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<div id="blackout-veil"><div class="bo-gps" id="blackout-gps"></div><div class="bo-hint">Tape 5 fois pour sortir</div></div>

<!-- ===================== CONNEXION ===================== -->
<div id="login">
  <svg class="scope" viewBox="0 0 400 400" aria-hidden="true">
    <defs><radialGradient id="lg1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a8efc0" stop-opacity=".10"/><stop offset=".7" stop-color="#a8efc0" stop-opacity=".02"/><stop offset="1" stop-color="#a8efc0" stop-opacity="0"/></radialGradient></defs>
    <circle cx="200" cy="200" r="196" fill="url(#lg1)"/>
    <g fill="none" stroke="#a8efc0" stroke-opacity=".18"><circle cx="200" cy="200" r="190"/><circle cx="200" cy="200" r="130" stroke-dasharray="2 6"/><circle cx="200" cy="200" r="70"/>
    <path d="M200 10v120M200 270v120M10 200h120M270 200h120"/></g>
  </svg>
  <div class="card">

/* =====================================================================
   STOCKAGE LOCAL : IndexedDB (plusieurs centaines de Mo possibles)
   L'ancienne version mettait tout dans localStorage (≈5 Mo max) : sur
   mobile, dès que photos/PDF dépassaient la limite, l'écriture échouait
   en silence -> au redémarrage, l'appli avait perdu des fiches.
   ===================================================================== */
var IDB=null;
function idbOpen(){
  return new Promise(function(res){
    try{
      var r=indexedDB.open('brown_squadron_ops',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('rows');};
      r.onsuccess=function(){IDB=r.result;res(true);};
      r.onerror=function(){res(false);};
      r.onblocked=function(){res(false);};
    }catch(e){res(false);}
  });
}
function idbAll(){
  return new Promise(function(res){
    if(!IDB){res({});return;}
    try{
      var out={};var tx=IDB.transaction('rows','readonly');var st=tx.objectStore('rows');
      var req=st.openCursor();
      req.onsuccess=function(){var c=req.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};
      req.onerror=function(){res(out);};
    }catch(e){res({});}
  });
}
var _idbQueue={},_idbT=null;
function idbPut(id){_idbQueue[id]=1;clearTimeout(_idbT);_idbT=setTimeout(idbFlush,250);}
function idbFlush(){
  if(!IDB){_idbQueue={};return;}
  var ids=Object.keys(_idbQueue);_idbQueue={};
  try{
    var tx=IDB.transaction('rows','readwrite');var st=tx.objectStore('rows');
    ids.forEach(function(id){if(db[id])st.put({d:db[id],u:dbTs[id]||null},id);else st.delete(id);});
  }catch(e){}
}
/* appelé par le module carte après modification */
var MAP_WORLD_KEY_CORE='__mapworld__';
function cacheLocal(id){if(id){idbPut(id);return;}idbPut(MAP_WORLD_KEY_CORE);Object.keys(db).forEach(function(k){if(db[k]&&db[k].type==='operation')idbPut(k);});}

/* ---------- files d'attente (envois / suppressions non encore confirmés par le serveur) ---------- */
function lsGet(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pendingList(){return lsGet('bs_pending_push',[]);}
function pendingAdd(id){var p=pendingList();if(p.indexOf(id)<0){p.push(id);lsSet('bs_pending_push',p);}}
function pendingRemove(id){var p=pendingList();var i=p.indexOf(id);if(i>=0){p.splice(i,1);lsSet('bs_pending_push',p);}}
function delList(){return lsGet('bs_pending_del',[]);}
function delAdd(id){var p=delList();if(p.indexOf(id)<0){p.push(id);lsSet('bs_pending_del',p);}}
function delRemove(id){var p=delList();var i=p.indexOf(id);if(i>=0){p.splice(i,1);lsSet('bs_pending_del',p);}}

/* =====================================================================
   SYNCHRO SUPABASE — nouvelle méthode
   1) on envoie ce qui attend localement ;
   2) on lit l'INDEX léger du serveur (id, type, updated_at) ;
   3) on supprime localement ce qui n'existe plus sur le serveur ;
   4) on ne télécharge QUE les fiches nouvelles/modifiées, par petits lots,
      une fiche lourde qui échoue ne bloque plus les autres.
   Plus de curseur de date : l'heure de l'appareil n'a plus aucune influence.
   ===================================================================== */
var syncBusy=false,syncAgain=false,syncState='busy',syncText='Synchro…',lastSyncAt=null;
function withTimeout(q,ms){
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  if(ctrl&&q&&q.abortSignal)q=q.abortSignal(ctrl.signal);
  return new Promise(function(res,rej){
    var t=setTimeout(function(){try{ctrl&&ctrl.abort();}catch(e){}rej(new Error('délai dépassé'));},ms);
    Promise.resolve(q).then(function(r){clearTimeout(t);res(r);},function(e){clearTimeout(t);rej(e);});
  });
}
function setSync(state,text){
  syncState=state;syncText=text;
  var p=$('sync-pill');if(!p)return;
  var n=pendingList().length+delList().length;
  p.className='sync '+state;
  $('sync-txt').textContent=n?(n+' en attente'):text;
  if(n&&state==='ok')p.className='sync warn';
}
async function flushPending(){
  if(!sb)return;
  var dels=delList();
  for(var i=0;i<dels.length;i++){
    try{var r=await withTimeout(sb.from('entries').delete().eq('id',dels[i]),20000);if(!r.error)delRemove(dels[i]);}catch(e){}
  }
  var ids=pendingList();
  for(var j=0;j<ids.length;j++){
    if(!db[ids[j]]){pendingRemove(ids[j]);continue;}
    await cloudSave(ids[j],true);
  }
}
async function cloudRefresh(){
  if(!sb){setSync('warn','Hors ligne');return;}
  if(syncBusy){syncAgain=true;return;}
  syncBusy=true;setSync('busy','Synchro…');
  try{
    await flushPending();
    /* index léger */
    var idx=[],from=0;
    while(true){
      var r=await withTimeout(sb.from('entries').select('id,type,updated_at').order('id',{ascending:true}).range(from,from+999),25000);
      if(r.error)throw r.error;
      var rows=r.data||[];idx=idx.concat(rows);
      if(rows.length<1000)break;from+=1000;
    }
    var server={};idx.forEach(function(x){server[x.id]=x;});
    var pend={};pendingList().forEach(function(id){pend[id]=1;});
    var dels={};delList().forEach(function(id){dels[id]=1;});
    var changed=false;
    /* suppressions faites ailleurs + nettoyage des types abandonnés */
    Object.keys(db).forEach(function(id){
      var gone=!server[id]&&!pend[id];
      if(gone||isIgnored(id,db[id]&&db[id].type)||dels[id]){delete db[id];delete dbTs[id];idbPut(id);changed=true;}
    });
    /* fiches à télécharger */
    var need=idx.filter(function(x){return !isIgnored(x.id,x.type)&&!pend[x.id]&&!dels[x.id]&&dbTs[x.id]!==x.updated_at;})
      .map(function(x){return x.id;});
    /* priorité : opérations, membres, kit-list, cours (ce qu'on regarde en premier) */
    var prio={operation:0,membre:1,kitlist:2,commschans:2,pam:2,cours:3,eval:4,mapdata:5};
    need.sort(function(a,b){return (prio[(server[a]||{}).type]==null?9:prio[server[a].type])-(prio[(server[b]||{}).type]==null?9:prio[server[b].type]);});
    var failed=0,got=0;
    async function fetchIds(ids,ms){
      var res=await withTimeout(sb.from('entries').select('id,type,data,updated_at').in('id',ids),ms);
      if(res.error)throw res.error;
      (res.data||[]).forEach(function(row){
        var d=(row.data&&typeof row.data==='object')?row.data:{};
        d.type=row.type||d.type||'';
        db[row.id]=d;dbTs[row.id]=row.updated_at;idbPut(row.id);got++;
      });
    }
    for(var i=0;i<need.length;i+=6){
      var batch=need.slice(i,i+6);
      setSync('busy','Synchro '+Math.min(i+6,need.length)+'/'+need.length);
      try{await fetchIds(batch,30000);}
      catch(e){
        /* lot trop lourd ou réseau faible : une par une, sans bloquer le reste */
        for(var k=0;k<batch.length;k++){try{await fetchIds([batch[k]],60000);}catch(e2){failed++;}}
      }
      changed=true;renderSoon();
    }
    lastSyncAt=new Date();
    if(changed)renderSoon();
    if(failed){setSync('warn',failed+' fiche(s) non reçue(s)');clearTimeout(window._retryT);window._retryT=setTimeout(cloudRefresh,10000);}
    else setSync('ok','À jour');
    try{migrateKitModel();}catch(e){}
  }catch(err){
    setSync('warn','Hors ligne');
  }finally{
    syncBusy=false;
    if(syncAgain){syncAgain=false;setTimeout(cloudRefresh,300);}
  }
}
async function cloudSave(id,fromFlush){
  pendingAdd(id);idbPut(id);
  if(!sb){setSync('warn','Hors ligne');return false;}
  var d=db[id];if(!d){pendingRemove(id);return true;}
  try{
    var ts=new Date().toISOString();
    var r=await withTimeout(sb.from('entries').upsert({id:id,type:d.type||'',data:d,updated_at:ts}).select('updated_at'),60000);
    if(r.error)throw r.error;
    dbTs[id]=(r.data&&r.data[0]&&r.data[0].updated_at)||ts;
    pendingRemove(id);idbPut(id);
    if(!fromFlush)setSync('ok','À jour');
    return true;
  }catch(e){
    if(!fromFlush){setSync('warn','En attente');toast('Pas de réseau : enregistré sur cet appareil, envoi automatique dès que possible.',true);}
    return false;
  }
}
async function cloudDelete(id){
  delete db[id];delete dbTs[id];idbPut(id);pendingRemove(id);delAdd(id);renderSoon();
  if(!sb)return;
  try{var r=await withTimeout(sb.from('entries').delete().eq('id',id),20000);if(!r.error)delRemove(id);}catch(e){}
  setSync(syncState,syncText);
}
/* modification « fusionnée » : on relit la version serveur juste avant d'écrire,
   pour ne pas écraser ce qu'un autre membre vient d'enregistrer (présences, PAM, kit-list) */
async function cloudMutate(id,fn,defType){
  pendingAdd(id);
  var local=db[id]?db[id]:{type:defType||''};fn(local);db[id]=local;renderSoon(true);
  if(sb){
    try{
      var r=await withTimeout(sb.from('entries').select('data,type').eq('id',id).maybeSingle(),12000);
      if(!r.error&&r.data){var fresh=r.data.data||{};fresh.type=r.data.type||fresh.type||defType||'';fn(fresh);db[id]=fresh;}
    }catch(e){}
  }
  return cloudSave(id);
}
var _renderT=null;
function renderSoon(now){clearTimeout(_renderT);_renderT=setTimeout(renderAll,now?0:120);}

async function sha256hex(str){var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [].map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');}
function togglePwd(){var i=$('login-pwd');i.type=i.type==='password'?'text':'password';}
function tryLogin(){
  var v=$('login-pwd').value;
  sha256hex(v).then(function(h){
    var role=null;for(var r in ROLE_HASHES){if(ROLE_HASHES[r]===h){role=r;break;}}
    if(!role){$('login-err').textContent='Mot de passe incorrect.';return;}
    currentRole=role;
    try{localStorage.setItem('bs_role',role);sessionStorage.setItem('bs_role',role);}catch(e){}
    startApp();
  });
}
function logout(){
  try{localStorage.removeItem('bs_role');sessionStorage.removeItem('bs_role');}catch(e){}
  try{if(typeof gpsOn!=='undefined'&&gpsOn&&typeof toggleGps==='function')toggleGps();}catch(e){}
  location.reload();
}
function applyRole(){
  document.body.classList.remove('role-admin','role-membre','role-lecture');
  document.body.classList.add('role-'+currentRole);
}
async function startApp(){
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  applyRole();
  if(window.supabase&&SB_URL&&SB_KEY){try{sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){sb=null;}}
  await idbOpen();
  var rows=await idbAll();
  Object.keys(rows).forEach(function(id){var v=rows[id];if(v&&v.d&&!isIgnored(id,v.d.type)){db[id]=v.d;dbTs[id]=v.u||undefined;}});
  migrateOldCache();
  route(history.state&&history.state.v?history.state:{v:'home'},true);
  renderAll();
  cloudRefresh();
  subscribeEntries();
  setInterval(function(){if(!document.hidden)cloudRefresh();},30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)cloudRefresh();});
  window.addEventListener('online',function(){cloudRefresh();});
  window.addEventListener('beforeunload',function(e){if(pendingList().length){e.preventDefault();e.returnValue='';}});
  /* précharge la carte en tâche de fond (après l'affichage) */
  setTimeout(function(){if(window.requestIdleCallback)requestIdleCallback(function(){ensureMapLib();});},4000);
}
/* reprise de l'ancien cache localStorage (une seule fois) puis libération de la place */
function migrateOldCache(){
  var old=null;try{old=JSON.parse(localStorage.getItem('brown_squadron_v1')||'null');}catch(e){}
  if(old&&typeof old==='object'){
    var pend={};pendingList().forEach(function(id){pend[id]=1;});
    Object.keys(old).forEach(function(id){
      var d=old[id];if(!d||isIgnored(id,d.type))return;
      if(!db[id]||pend[id]){db[id]=d;idbPut(id);}
    });
  }
  try{
    var kill=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
      if(k==='brown_squadron_v1'||k==='bs_lastsync'||k==='bs_pam'||/^bs_(op_photo_|opmount|opitemcol|gun|mount|eq_|build)/.test(k))kill.push(k);}
    if(old)setTimeout(function(){kill.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});},3000);
    else kill.forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
  }catch(e){}
}
var entriesChannel=null;
function subscribeEntries(){
  if(!sb||entriesChannel)return;
  try{
    entriesChannel=sb.channel('entries-live-v3')
      .on('postgres_changes',{event:'*',schema:'public',table:'entries'},function(p){
        var id=(p.new&&p.new.id)||(p.old&&p.old.id);
        if(id==='__mapworld__'){if(typeof refreshWorld==='function'&&curView==='map')refreshWorld();return;}
        clearTimeout(window._rtT);window._rtT=setTimeout(cloudRefresh,600);
      }).subscribe();
  }catch(e){}
}

var VIEWS={
  home:{t:'Brown Squadron',nav:'home'},membres:{t:'Membres',nav:'membres'},fiche:{t:'Fiche membre',nav:'membres',parent:'membres',form:1},
  calendrier:{t:'Agenda',nav:'calendrier'},operations:{t:'Opérations',nav:'operations'},op:{t:'Opération',nav:'operations',parent:'operations'},
  'op-edit':{t:'Modifier l\'opération',nav:'operations',parent:'operations',form:1},
  drill:{t:'Drill',nav:'drill'},cours:{t:'Cours',nav:'drill',parent:'drill'},'cours-edit':{t:'Modifier le cours',nav:'drill',parent:'drill',form:1},
  map:{t:'Carte',nav:'map'},comms:{t:'Comms',nav:'comms'},chat:{t:'Conversation',nav:'comms',parent:'comms'},
  eval:{t:'Éval Bull',nav:'eval'},'eval-fiche':{t:'Fiche Bull',nav:'eval',parent:'eval',form:1}
};
var curView='home',curParam=null,navDepth=0;
function go(v,param,opt){
  opt=opt||{};
  if(!VIEWS[v])v='home';
  if(VIEWS[v].nav==='eval'&&!canAdmin())v='home';
  var st={v:v,p:param==null?null:param};
  try{
    if(opt.replace||(curView===v&&curParam===st.p))history.replaceState(st,'');
    else{history.pushState(st,'');navDepth++;}
  }catch(e){}
  route(st,false,opt);
}
function goBack(){
  if(navDepth>0){navDepth--;history.back();return;}
  var p=VIEWS[curView]&&VIEWS[curView].parent;go(p||'home',null,{replace:true});
}
window.addEventListener('popstate',function(e){
  var st=e.state||{v:'home'};
  if(VIEWS[curView]&&VIEWS[curView].form&&window._formDirty&&!confirm('Quitter sans enregistrer ?')){
    try{history.pushState({v:curView,p:curParam},'');}catch(err){}return;}
  if(navDepth>0)navDepth--;
  route(st,false);
});
function route(st,first,opt){
  opt=opt||{};
  var v=st.v||'home';if(!VIEWS[v])v='home';
  window._formDirty=false;
  if(curView==='map'&&v!=='map'){try{if(typeof mapIsFs!=='undefined'&&mapIsFs)exitMapFullscreen();}catch(e){}}
  curView=v;curParam=st.p;
  document.querySelectorAll('.view').forEach(function(s){s.classList.remove('on');});
  var el=$('view-'+v);if(el)el.classList.add('on');
  document.querySelectorAll('#nav button[data-nav]').forEach(function(b){
    var key=b.getAttribute('data-nav');var on=key===VIEWS[v].nav;
    if(key==='more')on=['drill','map','comms','eval'].indexOf(VIEWS[v].nav)>=0&&window.innerWidth<960;
    b.classList.toggle('on',on);
  });
  $('tb-title').textContent=VIEWS[v].t;
  var hasParent=!!VIEWS[v].parent;
  $('tb-back').classList.toggle('hidden',!hasParent);
  $('tb-logo').classList.toggle('hidden',hasParent);
  if(!opt.keepScroll)window.scrollTo(0,0);
  renderView(v,st.p,opt);
  closeSheet();
}
function renderView(v,p,opt){
  switch(v){
    case 'home':renderHome();break;
    case 'membres':renderMembres();break;
    case 'fiche':openFiche(p);break;
    case 'calendrier':renderCalendar();break;
    case 'operations':renderOps();break;
    case 'op':renderOpView(p);break;
    case 'op-edit':renderOpEdit(p);break;
    case 'drill':renderCours();break;
    case 'cours':renderCoursView(p);break;
    case 'cours-edit':renderCoursEdit(p);break;
    case 'map':ensureMapLib().then(function(){if(!(opt&&opt.keepOpMode))mapOpMode=null;initMap();});break;
    case 'comms':renderComms();break;
    case 'chat':renderChat(p);break;
    case 'eval':renderEvalList();break;

  cloudMutate(KIT_DOC_KEY,function(x){

      a2[at]={name:'Combat Pant et/ou coupe field AOR2',req:!!req};if(i1>=0&&i2>=0)a2.splice(i2,1);}

function toggleReq(sec,i,j){

var kitDrag=null;
function kitDragStart(ev,i){
  ev.preventDefault();var row=ev.target.closest('.ki');kitDrag={from:i,row:row,to:null};row.classList.add('dragging');
  document.addEventListener('pointermove',kitDragMove);document.addEventListener('pointerup',kitDragEnd);

function kitDragMove(ev){if(!kitDrag)return;var rows=[].slice.call(document.querySelectorAll('#kit-box .ki[data-i]'));
  rows.forEach(function(r){r.classList.remove('drop-above');var b=r.getBoundingClientRect();if(r!==kitDrag.row&&ev.clientY>b.top&&ev.clientY<b.bottom){r.classList.add('drop-above');kitDrag.to=+r.getAttribute('data-i');}});}
function kitDragEnd(){document.removeEventListener('pointermove',kitDragMove);document.removeEventListener('pointerup',kitDragEnd);
  var d=kitDrag;kitDrag=null;if(!d)return;if(d.to==null||d.to===d.from){renderKitBox();return;}
  var names=(kitModel()[kitSec]||[]).map(function(a){return a.name;});var mv=names.splice(d.from,1)[0];var to=d.to;if(d.from<to)to--;names.splice(to,0,mv);var sec=kitSec;
  mutateKitModel(function(m){var by={};m[sec].forEach(function(a){by[a.name]=a;});var out=names.filter(function(n){return by[n];}).map(function(n){return by[n];});
    m[sec].forEach(function(a){if(names.indexOf(a.name)<0)out.push(a);});m[sec]=out;});renderKitBox();}

function compressImage(file,cb,maxDim,quality){
  maxDim=maxDim||1600;quality=quality||0.72;
  if(!file.type||file.type.indexOf('image')!==0){var r0=new FileReader();r0.onload=function(e){cb(e.target.result);};r0.readAsDataURL(file);return;}
  var r=new FileReader();
  r.onload=function(e){var img=new Image();
    img.onload=function(){var w=img.width,h=img.height;if(w>maxDim||h>maxDim){var s=Math.min(maxDim/w,maxDim/h);w=Math.round(w*s);h=Math.round(h*s);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      try{cb(cv.toDataURL('image/jpeg',quality));}catch(err){cb(e.target.result);}};
    img.onerror=function(){cb(e.target.result);};img.src=e.target.result;};
  r.readAsDataURL(file);
}

/* affiche TOUTES les pages des PDF directement dans le cours (sur iPhone, l'aperçu PDF natif n'affiche souvent que la 1re page) */
function renderInlinePdfs(id){
  var boxes=[].slice.call(document.querySelectorAll('#view-cours .pdf-pages'));if(!boxes.length)return;
  ensurePdfJs().then(function(){
    boxes.reduce(function(chain,box){return chain.then(function(){
      if(curView!=='cours'||currentCoursId!==id)return;
      var b=(db[id].blocks||[])[+box.getAttribute('data-blk')];if(!b||!b.data)return;
      var bin=atob(b.data.split(',')[1]);var arr=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);
      return pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){

<script>
function parseAnyCoord(str){
  if(!str)return null;
  var s=str.trim().replace(/,/g,' ').replace(/\s+/g,' ');
  // 1) format décimal simple : deux nombres
  var dec=s.match(/^(-?\d+(?:\.\d+)?)[ ]+(-?\d+(?:\.\d+)?)$/);
  if(dec){var la=parseFloat(dec[1]),lo=parseFloat(dec[2]);
    if(Math.abs(la)<=90&&Math.abs(lo)<=180)return{lat:la,lon:lo};}
  // 2) format avec hémisphères et/ou DMS : on découpe en deux moitiés (lat puis lon)
  // on cherche les lettres N/S puis E/O/W
  function dmsToDec(part){
    if(!part)return null;
    var neg=/[swo]/i.test(part);
    var nums=part.match(/-?\d+(?:\.\d+)?/g);
    if(!nums||!nums.length)return null;
    var deg=parseFloat(nums[0]);
    var min=nums[1]?parseFloat(nums[1]):0;
    var sec=nums[2]?parseFloat(nums[2]):0;
    var val=Math.abs(deg)+min/60+sec/3600;
    if(neg||deg<0)val=-val;
    return val;
  }
  // séparer sur la frontière entre lat et lon : présence de N/S puis E/W/O
  var mm=s.match(/^(.*?[nsNS])\s*(.*[ewoEWO].*)$/);
  if(mm){var la2=dmsToDec(mm[1]),lo2=dmsToDec(mm[2]);
    if(la2!=null&&lo2!=null&&Math.abs(la2)<=90&&Math.abs(lo2)<=180)return{lat:la2,lon:lo2};}
  // 3) deux groupes DMS sans lettres, séparés : "43 54 12 / 4 49 37"
  var groups=s.split(/[\/|]/);
  if(groups.length===2){var la3=dmsToDec(groups[0]),lo3=dmsToDec(groups[1]);
    if(la3!=null&&lo3!=null&&Math.abs(la3)<=90&&Math.abs(lo3)<=180)return{lat:la3,lon:lo3};}
  return null;
}

/* ---------- géométrie ---------- */
function haversine(a,b){var R=6371000,r=Math.PI/180,dLa=(b[1]-a[1])*r,dLo=(b[0]-a[0])*r;
  var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLo/2)*Math.sin(dLo/2);return 2*R*Math.asin(Math.sqrt(s));}
function lineLen(c){var t=0;for(var i=1;i<c.length;i++)t+=haversine(c[i-1],c[i]);return t;}
function fmtDist(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(2).replace('.',',')+' km';}
function areaM2(c){if(c.length<3)return 0;var R=6378137,r=Math.PI/180,s=0;
  for(var i=0;i<c.length;i++){var p1=c[i],p2=c[(i+1)%c.length];s+=(p2[0]-p1[0])*r*(2+Math.sin(p1[1]*r)+Math.sin(p2[1]*r));}return Math.abs(s*R*R/2);}
function fmtArea(a){return a<10000?Math.round(a)+' m²':(a/10000).toFixed(2).replace('.',',')+' ha';}
function shortAge(ts){var m=Math.max(0,Math.round((Date.now()-ts)/60000));return m<60?m+' min':Math.floor(m/60)+' h';}
function ago(ts){if(!ts)return '';var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'à l\'instant';if(m<60)return 'il y a '+m+' min';var h=Math.round(m/60);return h<24?'il y a '+h+' h':'le '+new Date(ts).toLocaleDateString('fr-FR');}

function shapeFeature(s){
  var c=s.coords||[];if(c.length<2)return null;
  if(s.kind==='zone'&&c.length>=3)return {type:'Feature',properties:{id:s.id,t:'zone',color:s.color||'#ffd24a'},geometry:{type:'Polygon',coordinates:[c.concat([c[0]])]}};
  return {type:'Feature',properties:{id:s.id,t:s.kind==='zone'?'foot':s.kind,color:s.color||'#ffd24a'},geometry:{type:'LineString',coordinates:c}};
}
function redrawMap(){
  if(!map||!mapReady)return;
  var w=world();
  try{map.getSource('mw').setData({type:'FeatureCollection',features:w.shapes.map(shapeFeature).filter(Boolean)});}catch(e){}
  var want={};
  w.pings.forEach(function(p){want['p_'+p.id]={item:p,c:'pings'};});
  w.stickers.forEach(function(s){want['s_'+s.id]={item:s,c:'stickers'};});
  w.shapes.forEach(function(s){if(s.coords&&s.coords.length>1&&(s.kind!=='zone'||s.coords.length>=3))want['l_'+s.id]={item:s,c:'label'};});
  operationsOf().forEach(function(o){if(o.gps&&typeof o.gps.lat==='number')want['o_'+o._id]={item:o,c:'op'};});
  Object.keys(mapMarkers).forEach(function(k){if(!want[k]){mapMarkers[k].m.remove();delete mapMarkers[k];}});
  Object.keys(want).forEach(function(k){
    var w2=want[k],it=w2.item;var sig=JSON.stringify([it.lat,it.lon,it.color,it.note,it.kind,it.num,it.name,it.gps,it.coords&&it.coords.length,it.coords&&it.coords[it.coords.length-1]]);
    var ex=mapMarkers[k];if(ex&&ex.sig===sig)return;if(ex)ex.m.remove();
    var el=markerEl(w2.c,it);var pos;
    if(w2.c==='label'){pos=it.kind==='zone'?centroid(it.coords):it.coords[it.coords.length-1];}
    else if(w2.c==='op'){pos=[it.gps.lon,it.gps.lat];}else pos=[it.lon,it.lat];
    if(typeof pos[0]!=='number'||typeof pos[1]!=='number')return;
    var m=new maplibregl.Marker({element:el,anchor:w2.c==='pings'?'bottom':'center'}).setLngLat(pos).addTo(map);
    mapMarkers[k]={m:m,sig:sig};
  });
}
/* un marqueur = UN seul élément (jamais de transform CSS sur la racine : MapLibre s'en sert pour le placer) */
function centroid(c){var x=0,y=0;c.forEach(function(p){x+=p[0];y+=p[1];});return [x/c.length,y/c.length];}
function distLabelHTML(kind,coords,color){
  var ic=kind==='zone'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 7l6-3 10 4-2 11-12-2z"/></svg>'
    :(kind==='foot'?'<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="8" cy="7" rx="3" ry="4.2"/><ellipse cx="16" cy="15" rx="3" ry="4.2"/></svg>'
    :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17 17 3l4 4L7 21z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/></svg>');
  var v=kind==='zone'?fmtArea(areaM2(coords)):fmtDist(lineLen(coords));
  var sub=kind==='zone'?'':'<small>'+walkTime(lineLen(coords))+'</small>';
  return '<i style="background:'+esc(color||'#ffd24a')+'"></i>'+ic+'<b>'+v+'</b>'+sub;
}
/* temps de marche estimé (4 km/h, chargé, terrain varié) */
function walkTime(m){var min=Math.round(m/4000*60);return min<1?'< 1 min':(min<60?min+' min':Math.floor(min/60)+' h '+String(min%60).padStart(2,'0'));}

function wireFootDrawing(){

  function ll(ev){var r=cont.getBoundingClientRect();var p=map.unproject([ev.clientX-r.left,ev.clientY-r.top]);return [p.lng,p.lat];}
  cont.addEventListener('pointerdown',function(ev){if(mapTool!=='foot')return;drawing=true;mapDraft=[ll(ev)];try{cont.setPointerCapture(ev.pointerId);}catch(e){}ev.preventDefault();},true);
  cont.addEventListener('pointermove',function(ev){if(!drawing)return;var p=ll(ev);var last=mapDraft[mapDraft.length-1];
    var a=map.project(last),b=map.project(p);if(Math.hypot(a.x-b.x,a.y-b.y)>4){mapDraft.push(p);updateDraft();}},true);
  function end(){if(!drawing)return;drawing=false;
    if(mapDraft.length>=2){var s={id:uid(),kind:'foot',color:mapColor,coords:mapDraft.slice(),op:mapCurrentOp(),ts:Date.now(),by:myCallsign()};
      mapDraft=[];addItem('shapes',s);toast('Chemin enregistré · '+fmtDist(lineLen(s.coords)));setMapTool(null);}

  var me=myCallsign();gpsData[me]={pseudo:me,lat:gpsLast.lat,lon:gpsLast.lon,color:lsGet('bs_gps_color','#46b29d'),heading:gpsHeading,updated_at:new Date().toISOString(),me:true,acc:acc};
  renderGps();
  if(first&&map)map.flyTo({center:[gpsLast.lon,gpsLast.lat],zoom:Math.max(map.getZoom(),16)});

function sendMyPos(){
  if(!sb||!gpsOn||!gpsLast)return;gpsSentAt=Date.now();
  var row={pseudo:myCallsign(),lat:gpsLast.lat,lon:gpsLast.lon,color:lsGet('bs_gps_color','#46b29d'),updated_at:new Date().toISOString()};
  if(gpsHeading!=null)row.heading=Math.round(gpsHeading);
  sb.from('positions').upsert(row).then(function(r){if(r&&r.error)toast('Position non envoyée : '+r.error.message,true);},function(){});
}
function startHeading(){
  function bind(){window.addEventListener('deviceorientationabsolute',onHead,true);window.addEventListener('deviceorientation',onHead,true);}
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')DeviceOrientationEvent.requestPermission().then(function(s){if(s==='granted')bind();}).catch(function(){});else bind();}catch(e){}
}
function onHead(e){var h=null;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(e.absolute&&typeof e.alpha==='number')h=360-e.alpha;
  if(h==null)return;gpsHeading=h;var me=gpsData[myCallsign()];if(me){me.heading=h;var a=document.querySelector('.mk-gps.me .arrow');if(a&&map)a.style.transform='rotate('+(h-map.getBearing())+'deg)';}}
function loadPositions(){
  if(!sb)return;
  withTimeout(sb.from('positions').select('*'),12000).then(function(r){
    if(!r||r.error)return;var me=myCallsign();var next={};
    (r.data||[]).forEach(function(p){if(typeof p.lat!=='number'||typeof p.lon!=='number')return;if(p.pseudo===me&&gpsOn)return;if(gpsFresh(p))next[p.pseudo]=p;});
    if(gpsOn&&gpsData[me])next[me]=gpsData[me];

  },function(){});
}
function subscribePositions(){
  if(!sb||gpsChan)return;

/* les membres proches à l'écran sont REGROUPÉS (pastille ×N) au lieu de s'empiler */
function renderGps(){
  if(!map||!mapReady)return;
  gpsMk.forEach(function(m){m.remove();});gpsMk=[];
  var list=Object.keys(gpsData).map(function(k){return gpsData[k];}).filter(gpsFresh);
  var pts=list.map(function(p){var s=map.project([p.lon,p.lat]);return {p:p,x:s.x,y:s.y};});
  var used={},groups=[];
  pts.forEach(function(a,i){if(used[i])return;var g=[a];used[i]=1;
    pts.forEach(function(b,j){if(!used[j]&&Math.hypot(a.x-b.x,a.y-b.y)<30){g.push(b);used[j]=1;}});groups.push(g);});
  groups.forEach(function(g){
    var el=document.createElement('div');var lon,lat;
    if(g.length===1){var p=g[0].p;lon=p.lon;lat=p.lat;var col=esc(p.color||'#46b29d');
      el.className='mk-gps'+((p.me||p.pseudo===myCallsign())?' me':'');
      el.innerHTML='<span class="arrow" style="border-bottom-color:'+col+(typeof p.heading==='number'?';transform:rotate('+(p.heading-map.getBearing())+'deg)':';display:none')+'"></span>'+
        '<span class="dot" style="background:'+col+';box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 14px '+col+'"></span><span class="n">'+esc(p.pseudo)+'</span>';
    }else{
      lon=g.reduce(function(s,x){return s+x.p.lon;},0)/g.length;lat=g.reduce(function(s,x){return s+x.p.lat;},0)/g.length;
      el.className='mk-gps grp';
      el.innerHTML='<span class="dot">'+g.length+'</span><span class="n">'+g.map(function(x){return esc(x.p.pseudo);}).join('<br>')+'</span>';
      el.onclick=function(e){e.stopPropagation();var b=new maplibregl.LngLatBounds([g[0].p.lon,g[0].p.lat],[g[0].p.lon,g[0].p.lat]);g.forEach(function(x){b.extend([x.p.lon,x.p.lat]);});
        if(map.getZoom()>=19)toast(g.map(function(x){return x.p.pseudo;}).join(', ')+' : au même endroit');else map.fitBounds(b,{padding:120,maxZoom:21});};
    }
    gpsMk.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lon,lat]).addTo(map));
  });
}

function genMapPDF(){
  if(!map||!mapReady){toast('Ouvre la carte d\'abord.',true);return;}
  var w=window.open('','_blank');
  map.once('idle',function(){
    var src=map.getCanvas();var cv=document.createElement('canvas');cv.width=src.width;cv.height=src.height;var g=cv.getContext('2d');
    try{g.drawImage(src,0,0);}catch(e){}
    var k=src.width/src.clientWidth;var wd=world();
    function at(lon,lat){var p=map.project([lon,lat]);return [p.x*k,p.y*k];}
    function disc(x,y,r,fill,stroke){g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=fill;g.fill();g.lineWidth=2*k;g.strokeStyle=stroke||'#fff';g.stroke();}
    wd.pings.forEach(function(p){var a=at(p.lon,p.lat);disc(a[0],a[1]-6*k,7*k,p.color||'#ffd24a');});
    wd.stickers.forEach(function(s){var a=at(s.lon,s.lat),x=a[0],y=a[1],r=11*k;
      if(s.kind==='medic'){disc(x,y,r,'#fff','#d93a26');g.fillStyle='#d93a26';g.fillRect(x-2.5*k,y-7*k,5*k,14*k);g.fillRect(x-7*k,y-2.5*k,14*k,5*k);}
      else if(s.kind==='danger'){g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r,y+r*.8);g.lineTo(x-r,y+r*.8);g.closePath();g.fillStyle='#ffb020';g.fill();g.fillStyle='#1a1405';g.font='bold '+(13*k)+'px Arial';g.textAlign='center';g.fillText('!',x,y+r*.6);}
      else if(s.kind==='ammo'){disc(x,y,r,'#2b2a1d','#d7b46a');g.fillStyle='#d7b46a';g.font='bold '+(10*k)+'px Arial';g.textAlign='center';g.fillText('MUN',x,y+3.5*k);}
      else disc(x,y,r*.8,'#5a6b3b');});
    var img='';try{img=cv.toDataURL('image/jpeg',.88);}catch(e){}
    var t=TYPES;var foots=wd.shapes.filter(function(s){return s.kind!=='zone';});var tac=wd.stickers.filter(function(s){return SYM[s.kind];});
    printDoc(w,'Carte tactique','Brown Squadron · '+new Date().toLocaleString('fr-FR'),'#5a6b3b',
      (img?'<img src="'+img+'" style="width:100%;border-radius:6px;border:1px solid #ccc">':'<p>Capture indisponible sur ce navigateur.</p>')+
      (foots.length?'<h2>Chemins et tracés</h2><table>'+foots.map(function(s,i){return '<tr><td style="width:20px;background:'+s.color+'"></td><td>'+({foot:'Chemin',measure:'Tracé'}[s.kind]||'Tracé')+' '+(i+1)+'</td><td>'+fmtDist(lineLen(s.coords||[]))+'</td></tr>';}).join('')+'</table>':'')+
      (tac.length?'<h2>Repères tactiques</h2><table>'+tac.map(function(s){return '<tr><td>'+SYM[s.kind].l+'</td><td>'+esc(s.note||'')+'</td><td>'+esc(s.by||'')+'</td><td>'+(s.ts?new Date(s.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'')+'</td></tr>';}).join('')+'</table>':''));
  });
  map.triggerRepaint();
}
